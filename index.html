function confirmLot(pfI,posI){
  const pos=state.portfolios[pfI]?.positions[posI];if(!pos)return;
  const d=gs('l_d');
  if(!d){showToast('Bitte ein Kaufdatum angeben');return;}
  const kurs=gv('l_k');
  if(!(kurs>0)){showToast('Bitte einen Kaufkurs > 0 angeben');return;}
  let stk=gv('l_s');
  const betrag=gv('l_b');
  if(!(stk>0)&&betrag>0)stk=betrag/kurs;
  if(!(stk>0)){showToast('Bitte Stückzahl oder Anlagebetrag angeben');return;}
  if(d<TRACKING_START){showToast('Erfassung beginnt am '+TRACKING_START.split('-').reverse().join('.'));return;}
  if(!Array.isArray(pos.lots))pos.lots=[];
  // Steckt der Kauf schon im Anfangsbestand? Dann dort abziehen statt aufaddieren.
  const imBestand=document.getElementById('l_imBestand')?.checked;
  if(imBestand){
    const anf=pos.lots.find(x=>x.typ==='anfang');
    if(!anf){showToast('Kein Anfangsbestand vorhanden — Haken entfernen');return;}
    if(anf.stueck+1e-9<stk){showToast('Anfangsbestand ('+anf.stueck.toFixed(4)+' Stk) ist kleiner als der Kauf — bitte prüfen');return;}
    anf.stueck-=stk;
  }
  pos.lots.push({d,stueck:stk,kurs,typ:'kauf'});
  syncAusLosen(pos);
  closeModal();render();
  // Hinweis, falls im selben Monat ein Ex-Tag auf/nach dem Kaufdatum liegt
  const kipp=(AUSSCHUETTUNGEN_2026[pos.ticker]?.items||[])
    .filter(x=>x.ex.slice(0,7)===d.slice(0,7)&&x.ex<=d);
  showToast(kipp.length
    ?'Kauf erfasst — Ex-Tag '+kipp[0].ex.split('-').reverse().join('.')+' lag bereits: zählt erst zur Folgeausschüttung'
    :'Kauf erfasst');
}
function deleteLot(pfI,posI,idx){
  const pos=state.portfolios[pfI]?.positions[posI];if(!pos||!Array.isArray(pos.lots))return;
  const l=pos.lots[idx];if(!l||l.typ==='anfang')return;
  pos.lots.splice(idx,1);
  syncAusLosen(pos);
  render();showToast('Los gelöscht');
}

// ===== YAHOO FINANCE KURSABRUF =====
// allorigins /get?url= gibt {contents:"JSON-String"}, corsproxy gibt direktes JSON
async function _fetchYahoo(ticker){
  const yurl=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=2d`;
  for(const proxy of[
    'https://api.allorigins.win/get?url=',
    'https://corsproxy.io/?'
  ]){
    try{
      const res=await fetch(proxy+encodeURIComponent(yurl),{signal:AbortSignal.timeout(8000)});
      if(!res.ok)continue;
      const json=await res.json();
      const raw=json.contents??json;
      const data=typeof raw==='string'?JSON.parse(raw):raw;
      const meta=data?.chart?.result?.[0]?.meta;
      if(meta?.regularMarketPrice>0){
        return{price:Math.round(meta.regularMarketPrice*10000)/10000,symbol:ticker};
      }
    }catch{}
  }
  return null;
}

// Symbol via Yahoo Search finden (ISIN → Ticker)
async function _searchYahoo(q){
  const surl=`https://query2.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=1&newsCount=0`;
  for(const proxy of['https://api.allorigins.win/get?url=','https://corsproxy.io/?']){
    try{
      const res=await fetch(proxy+encodeURIComponent(surl),{signal:AbortSignal.timeout(8000)});
      if(!res.ok)continue;
      const json=await res.json();
      const raw=json.contents??json;
      const data=typeof raw==='string'?JSON.parse(raw):raw;
      const sym=data?.quotes?.[0]?.symbol;
      if(sym)return sym;
    }catch{}
  }
  return null;
}

// Kurs für eine Position: Ticker → ISIN-Suche → WKN-Suche → WKN+Suffix
async function fetchPriceForPos(pos){
  if(pos.ticker){const r=await _fetchYahoo(pos.ticker);if(r)return r;}
  if(pos.isin){const s=await _searchYahoo(pos.isin);if(s){const r=await _fetchYahoo(s);if(r)return{...r,symbol:s};}}
  if(pos.wkn){const s=await _searchYahoo(pos.wkn);if(s){const r=await _fetchYahoo(s);if(r)return{...r,symbol:s};}}
  if(pos.wkn){
    for(const sx of['.DE','.F','.L','.AS','.PA','.MI','.SW','.MC']){
      const r=await _fetchYahoo(pos.wkn+sx);if(r)return r;
    }
  }
  if(pos.isin){const r=await _fetchYahoo(pos.isin);if(r)return r;}
  return null;
}

async function loadYahoo(pfI,pI){
  const pos=state.portfolios[pfI].positions[pI];
  if(!pos.isin&&!pos.ticker&&!pos.wkn){showToast('Kein ISIN/Ticker/WKN vorhanden');return;}
  showToast('⏳ Lade Kurs…');
  const r=await fetchPriceForPos(pos);
  if(r){
    const isin=(pos.isin||'').trim();
    state.portfolios.forEach(pf=>pf.positions.forEach(q=>{if(isin&&(q.isin||'').trim()===isin)q.kurs=r.price;}));
    pos.kurs=r.price;
    if(!pos.ticker&&r.symbol)pos.ticker=r.symbol;
    render();showToast(`✓ ${r.symbol}: ${r.price} €`);
  }
  else showToast('Kurs nicht verfügbar — bitte manuell eingeben');
}

let _autoFetchDone=false;
async function autoFetchAllPrices(){
  if(_autoFetchDone)return;
  _autoFetchDone=true;
  const map=new Map();
  state.portfolios.forEach(pf=>{
    if(!pf.enabled)return;
    pf.positions.forEach(pos=>{
      const key=(pos.isin||pos.ticker||'').trim();
      if(!key)return;
      if(!map.has(key))map.set(key,{poses:[],pos});
      map.get(key).poses.push(pos);
    });
  });
  let ok=0,fail=0;
  for(const[,{poses,pos}] of map){
    const r=await fetchPriceForPos(pos);
    if(r){poses.forEach(p=>{p.kurs=r.price;if(!p.ticker&&r.symbol)p.ticker=r.symbol;});ok++;}
    else fail++;
    await new Promise(res=>setTimeout(res,250));
  }
  render();
  showToast(ok>0?`✓ ${ok} Kurse geladen${fail?` · ${fail} n.v.`:''}`:'Kursabruf fehlgeschlagen');
}

// ===== IMPORT (natives RebalGold JSON + eigenes Format) =====
document.getElementById('json-file').addEventListener('change',function(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const raw=JSON.parse(ev.target.result);
      // Eigenes Format (zuvor exportiert)
      if(Array.isArray(raw.portfolios)){
        const allowed=['tab','sparrate','portfolios','divCalYear','strategyV','selectedSparIdx'];
        allowed.forEach(k=>{if(k in raw)state[k]=raw[k];});
        // Struktur absichern (wie beim Laden aus localStorage)
        state.portfolios.forEach(pf=>{
          (pf.positions||[]).forEach(pos=>{
            if(!pos.divs)pos.divs={};
            [2024,2025,2026,2027].forEach(yr=>{if(!Array.isArray(pos.divs[yr]))pos.divs[yr]=Array(12).fill(0);});
            ['stueck','kurs','kaufkurs','ter'].forEach(f=>{if(pos[f]===undefined)pos[f]=0;});
            if(pos.active===undefined)pos.active=true;
            if(pos.klasse===undefined)pos.klasse=0;
          });
          if(pf.sparAmount===undefined)pf.sparAmount=0;
          if(pf.enabled===undefined)pf.enabled=true;
        });
        state.view='list';saveState();render();showToast('Import erfolgreich (Web-Format)!');return;
      }
      // Natives RebalGold-Format (entries + __avd_data)
      if(raw.entries&&raw.schemaVersion){
        const entries=raw.entries;
        const dec=key=>{const v=entries[key];if(!v)return null;if(v.__avd_data)return b64dec(v.__avd_data);return v;};
        if(entries['PlanningInputStore.planning.monthly'])state.sparrate=entries['PlanningInputStore.planning.monthly'];
        const sp=dec('PortfolioStore.subPortfolios.v1');
        if(sp&&sp.slots){
          const reminders=dec('PortfolioStore.sparplanRemindersBySubPortfolio.v1')||{};
          const divMap=dec('PortfolioStore.manualDividendsByPosition.v1')||{};
          state.portfolios=sp.slots.filter(slot=>slot.displayName).map(slot=>{
            const positions=[];
            (slot.assetBuckets||[]).forEach(bkt=>{
              (bkt.unterpositionen||[]).forEach(pos=>{
                if(!pos.name&&!pos.isin)return;
                const rawDivs=divMap[pos.id]||{};
                const divs={};
                Object.entries(rawDivs).forEach(([mkey,epsVal])=>{
                  const yr=parseInt(mkey.slice(0,4));
                  const mi=parseInt(mkey.slice(5))-1;
                  if(!divs[yr])divs[yr]=Array(12).fill(0);
                  divs[yr][mi]=epsVal;
                });
                [2024,2025,2026,2027].forEach(y=>{if(!divs[y])divs[y]=Array(12).fill(0);});
                positions.push({
                  name:bkt.anzeigeNameOverride||pos.name||'',
                  isin:pos.isin||'',wkn:pos.wkn||'',ticker:pos.finnhubTicker||pos.ticker||'',
                  stueck:pos.stueckzahl||0,kurs:pos.kursAktuell||0,kaufkurs:pos.kursKauf||0,
                  target:bkt.zielProzentRisiko||pos.relGewichtInKlasse*100||100,
                  ter:pos.terProzentPA||0,active:bkt.klasseIstAktiv!==false&&pos.istAktiv!==false,
                  klasse:bkt.klasse||0,divs
                });
              });
            });
            return{
              name:slot.displayName,id:slot.id,
              strategy:'gewinnorientiert',activePortfolio:false,enabled:slot.isEnabled!==false,
              sparAmount:reminders[slot.id]||0,positions
            };
          });
          const ai=sp.activeIndex||0;
          if(state.portfolios[ai])state.portfolios[ai].activePortfolio=true;
          state.selectedSparIdx=ai;
          state.view='list';state.tab=0;
          saveState();render();showToast('Import erfolgreich ('+state.portfolios.length+' Portfolios)!');
          return;
        }
        showToast('Format erkannt, aber keine Portfolios gefunden.');
        return;
      }
      showToast('Unbekanntes JSON-Format');
    }catch(err){
      alert('Import-Fehler: '+err.message);console.error(err);
    }
  };
  reader.readAsText(file,'utf-8');
  e.target.value='';
});

#cs-fab{position:fixed;top:calc(env(safe-area-inset-top,0) + 10px);right:12px;z-index:400;
  width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(0,240,255,.4);
  background:rgba(0,0,0,.85);backdrop-filter:blur(10px);color:var(--cyan);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 12px rgba(0,240,255,.2);transition:all .2s}
#cs-fab.synced{border-color:var(--green);color:var(--green);box-shadow:0 0 12px rgba(57,255,106,.3)}
#cs-fab.syncing{animation:csSpin 1s linear infinite}
@keyframes csSpin{to{transform:rotate(360deg)}}
#cs-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.88);
  backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px}
#cs-overlay.open{display:flex}
.cs-box{background:var(--bg1);border:1px solid rgba(0,240,255,.4);border-radius:18px;
  width:100%;max-width:400px;padding:24px 20px;max-height:90vh;overflow-y:auto;
  box-shadow:0 0 40px rgba(0,240,255,.15)}
.cs-title{font-size:20px;font-weight:800;color:var(--cyan);margin-bottom:4px;text-align:center;
  text-shadow:0 0 12px rgba(0,240,255,.4)}
.cs-sub{font-size:12px;color:var(--t2);text-align:center;margin-bottom:20px}
.cs-field{margin-bottom:12px}
.cs-field label{font-size:11px;color:var(--t2);display:block;margin-bottom:4px;font-weight:600}
.cs-field input{width:100%;background:var(--bg0);border:1px solid var(--b);border-radius:10px;
  color:var(--t);padding:11px 13px;font-size:15px;outline:none;transition:border-color .2s}
.cs-field input:focus{border-color:var(--cyan)}
.cs-btn{width:100%;padding:12px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
  border:none;transition:all .2s;margin-top:4px}
.cs-btn-primary{background:var(--cyan);color:#000}
.cs-btn-primary:hover{box-shadow:0 0 16px rgba(0,240,255,.4)}
.cs-btn-green{background:var(--green);color:#000}
.cs-btn-ghost{background:transparent;border:1px solid var(--b);color:var(--t2);margin-top:8px}
.cs-btn-red{background:rgba(255,23,68,.12);border:1px solid rgba(255,23,68,.4);color:var(--red)}
.cs-tab-row{display:flex;gap:8px;margin-bottom:18px;background:var(--bg0);padding:4px;border-radius:10px}
.cs-tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:700;border-radius:8px;
  cursor:pointer;color:var(--t2);transition:all .2s}
.cs-tab.on{background:var(--cyan);color:#000}
.cs-msg{font-size:12px;padding:10px 12px;border-radius:8px;margin-bottom:12px;line-height:1.4}
.cs-msg.err{background:rgba(255,23,68,.12);border:1px solid rgba(255,23,68,.3);color:#ff6b8a}
.cs-msg.ok{background:rgba(57,255,106,.12);border:1px solid rgba(57,255,106,.3);color:var(--green)}
.cs-msg.info{background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.25);color:var(--cyan)}
.cs-status-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
  border-bottom:1px solid var(--b);font-size:13px}
.cs-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--t2);
  font-size:24px;cursor:pointer;line-height:1}
.cs-config-note{font-size:11px;color:var(--t3);line-height:1.5;margin-top:14px;
  padding:10px;background:var(--bg0);border-radius:8px;border:1px solid var(--b)}
</style>

<button id="cs-fab" title="Cloud-Sync" onclick="CloudSync.openPanel()">☁</button>
<div id="cs-overlay"><div class="cs-box" style="position:relative"></div></div>

<script>
(function(){
  'use strict';

  const CFG_KEY='rebalGold_fbConfig';
  const AUTOSYNC_KEY='rebalGold_fbAutoSync';
  const CS_DOC_KEY='rebalGold_v3';

  function getConfig(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'null');}catch{return null;}}
  function setConfigStore(c){localStorage.setItem(CFG_KEY,JSON.stringify(c));}
  const isConfigured=()=>{const c=getConfig();return!!(c&&c.apiKey&&c.projectId);};
  function autoSyncOn(){return localStorage.getItem(AUTOSYNC_KEY)!=='0';}
  function setAutoSync(v){localStorage.setItem(AUTOSYNC_KEY,v?'1':'0');}

  // Toleranter Config-Parser: JSON, JS-Objekt-Syntax, auch ohne geschweifte Klammern
  function parseConfig(raw){
    raw=(raw||'').trim();
    if(!raw)return null;
    if(!raw.startsWith('{'))raw='{'+raw;
    if(!raw.endsWith('}'))raw=raw+'}';
    raw=raw.replace(/^\{?\s*(const|var|let)\s+\w+\s*=\s*\{/,'{');
    try{return JSON.parse(raw);}catch{}
    try{
      const fixed=raw
        .replace(/([,{]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":')
        .replace(/'/g,'"')
        .replace(/,\s*([}\]])/g,'$1');
      return JSON.parse(fixed);
    }catch{return null;}
  }

  // Eindeutige, persistente Geräte-ID (Mac ≠ iPhone) — verhindert Sync-Kollisionen
  const DEVICE_ID=(function(){
    const k='rebalGold_deviceId';
    let id=localStorage.getItem(k);
    if(!id){id='dev-'+Math.random().toString(36).slice(2,10)+'-'+Date.now().toString(36);localStorage.setItem(k,id);}
    return id;
  })();

  let fb={app:null,auth:null,db:null,user:null};
  let ready=false;
  let syncing=false;
  let lastSync=null;
  let debounceTimer=null;
  let unsubDoc=null;
  let _suppressPush=false;
  let panelTab='login';
  // FIX v3.7: verhindert, dass ein Gerät vor dem ersten Cloud-Pull ungewollt
  // seinen (evtl. veralteten) lokalen Stand hochlädt und dabei neuere Daten
  // eines anderen Geräts überschreibt. Erst nach dem ersten erfolgreichen
  // Pull (oder der Feststellung "kein Dokument vorhanden") wird Push erlaubt.
  let hasPulledOnce=false;

  const $=s=>document.querySelector(s);
  const fab=()=>document.getElementById('cs-fab');
  const overlay=()=>document.getElementById('cs-overlay');
  const box=()=>overlay().querySelector('.cs-box');

  function toast(msg){if(window.showToast)window.showToast(msg);}

  async function loadFirebaseSDK(){
    if(window.firebase&&window.firebase.apps)return true;
    const scripts=[
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'
    ];
    for(const src of scripts){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src=src;s.onload=res;s.onerror=()=>rej(new Error('SDK-Laden fehlgeschlagen'));
        document.head.appendChild(s);
      });
    }
    return true;
  }

  async function initFirebase(){
    const cfg=getConfig();
    if(!cfg||!cfg.apiKey)return false;
    try{
      await loadFirebaseSDK();
      if(!fb.app){
        fb.app=firebase.initializeApp(cfg);
        fb.auth=firebase.auth();
        fb.db=firebase.firestore();
        fb.auth.onAuthStateChanged(u=>{
          fb.user=u;
          updateFab();
          if(u){
            if(autoSyncOn())startRealtimeSync();
            CS_pullNow(true);
          }
          else if(unsubDoc){unsubDoc();unsubDoc=null;}
          if(overlay().classList.contains('open'))renderPanel();
          if(window.__csSettingsRefresh)window.__csSettingsRefresh();
        });
      }
      ready=true;
      return true;
    }catch(e){console.error('Firebase Init fehlgeschlagen:',e);return false;}
  }

  function userDocRef(){
    if(!fb.user)return null;
    return fb.db.collection('users').doc(fb.user.uid).collection('rebalgold').doc('state');
  }

  function startRealtimeSync(){
    const ref=userDocRef();if(!ref)return;
    if(unsubDoc)unsubDoc();
    unsubDoc=ref.onSnapshot(snap=>{
      hasPulledOnce=true; // FIX v3.7: auch bei leerem Dokument gilt der erste Stand als bekannt
      if(!snap.exists)return;
      const data=snap.data();
      if(data&&data.state&&data._src!==DEVICE_ID){
        try{
          const cloudState=typeof data.state==='string'?JSON.parse(data.state):data.state;
          applyCloudState(cloudState);
          lastSync=new Date();updateFab();
        }catch(e){console.warn('Cloud→Local Merge fehlgeschlagen:',e);}
      }
    },err=>console.warn('Snapshot-Fehler:',err));
  }

  function applyCloudState(cloudState){
    const getS=window.__getState,setS=window.__setState;
    if(!getS||!setS||!window.render)return;
    const cur=getS();
    if(JSON.stringify(cur)===JSON.stringify(cloudState))return;
    const merged=cur;
    Object.keys(cloudState).forEach(k=>{merged[k]=cloudState[k];});
    setS(merged);
    _suppressPush=true;
    try{localStorage.setItem(CS_DOC_KEY,JSON.stringify(merged));}catch{}
    window.render();
    _suppressPush=false;
    toast('☁ Von Cloud aktualisiert');
  }

  function pushToCloud(stateObj){
    if(!fb.user||_suppressPush)return;
    clearTimeout(debounceTimer);
    debounceTimer=setTimeout(async()=>{
      const ref=userDocRef();if(!ref)return;
      syncing=true;updateFab();
      try{
        await ref.set({
          state:JSON.stringify(stateObj),
          _src:DEVICE_ID,
          updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
          device:navigator.userAgent.slice(0,80)
        },{merge:true});
        lastSync=new Date();
      }catch(e){console.warn('Cloud-Push fehlgeschlagen:',e);toast('⚠ Sync-Fehler');}
      syncing=false;updateFab();
    },1200);
  }

  window.CloudSync={
    onLocalSave(stateObj){if(ready&&fb.user&&autoSyncOn()&&hasPulledOnce)pushToCloud(stateObj);},
    openPanel(){
      const s=window.__getState&&window.__getState();
      if(s&&window.goTab){
        window.goTab(4);
        setTimeout(()=>{
          const acc=document.getElementById('ac0');
          if(acc){acc.classList.add('open');acc.scrollIntoView({behavior:'smooth',block:'start'});}
        },60);
      }else{
        renderPanel();overlay().classList.add('open');
      }
    }
  };

  function updateFab(){
    const f=fab();if(!f)return;
    f.classList.remove('synced','syncing');
    if(syncing){f.classList.add('syncing');f.textContent='↻';}
    else if(fb.user){f.classList.add('synced');f.textContent='☁';f.title='Synchronisiert: '+(fb.user.email||'');}
    else{f.textContent='☁';f.title='Cloud-Sync (nicht verbunden)';}
  }

  function renderPanel(){
    const b=box();
    if(!isConfigured()){
      b.innerHTML=`<button class="cs-close" onclick="document.getElementById('cs-overlay').classList.remove('open')">×</button>
        <div class="cs-title">☁ Cloud-Sync</div>
        <div class="cs-msg info">Firebase ist noch nicht konfiguriert. Unter Einstellungen → Cloud-Sync die Config einfügen.</div>`;
      return;
    }
    if(fb.user){
      b.innerHTML=`<button class="cs-close" onclick="document.getElementById('cs-overlay').classList.remove('open')">×</button>
        <div class="cs-title">☁ Verbunden</div>
        <div class="cs-sub">${fb.user.email}</div>
        <div class="cs-status-row"><span style="color:var(--t2)">Letzter Sync</span><span style="font-weight:700">${lastSync?lastSync.toLocaleTimeString('de-DE'):'–'}</span></div>
        <div class="cs-config-note">Weitere Optionen (Abmelden, manueller Sync) findest du unter Einstellungen → Cloud-Sync.</div>`;
      return;
    }
    b.innerHTML=`<button class="cs-close" onclick="document.getElementById('cs-overlay').classList.remove('open')">×</button>
      <div class="cs-title">☁ Nicht angemeldet</div>
      <div class="cs-config-note">Melde dich unter Einstellungen → Cloud-Sync an, um deine Daten zwischen Mac und iPhone zu synchronisieren.</div>`;
  }

  function showMsg(txt,type,slotId){
    const slot=$('#'+(slotId||'cs-msg-slot'));
    if(slot)slot.innerHTML=`<div class="cs-msg ${type}">${txt}</div>`;
  }

  window.buildCloudSyncSettingsBody=function(){
    const cfg=getConfig();
    const cfgText=cfg?JSON.stringify(cfg,null,2):'';

    let dot='⚪',title='Nicht konfiguriert',sub='Firebase-Konfiguration unten eintragen.';
    if(cfg&&!ready){dot='🟡';title='Verbinde…';sub='Firebase wird geladen.';}
    else if(cfg&&ready&&!fb.user){dot='🟡';title='Verbunden';sub='Bitte anmelden.';}
    else if(fb.user){dot='🟢';title='Angemeldet';sub=fb.user.email;}

    if(cfg&&!ready&&!fb.app){
      setTimeout(()=>{initFirebase().then(()=>{if(window.__csSettingsRefresh)window.__csSettingsRefresh();});},10);
    }

    return`
      <p class="hint" style="margin-bottom:12px">Synchronisiert deine Portfolios zwischen Mac und iPhone. Einmalige Einrichtung nötig — Firebase-Config unten einfügen.</p>

      <div style="display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:16px">
        <span style="font-size:22px">${dot}</span>
        <div>
          <div style="font-weight:800;font-size:14px">${title}</div>
          <div style="font-size:12px;color:var(--t2)">${sub}</div>
        </div>
      </div>

      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);font-weight:700;margin-bottom:6px">Firebase-Konfiguration (JSON aus der Firebase-Konsole)</div>
      <textarea id="css-fbcfg" rows="6" spellcheck="false"
        style="width:100%;background:var(--bg0);border:1px solid var(--b);border-radius:10px;color:var(--t);
          padding:10px 12px;font-size:12px;font-family:monospace;resize:vertical;outline:none"
        placeholder='{ "apiKey": "AIza...", "authDomain": "projekt.firebaseapp.com", "projectId": "projekt" }'>${cfgText}</textarea>
      <div class="btnrow" style="margin-top:8px;margin-bottom:18px">
        <button class="btn btn-c" style="flex:1" onclick="CS_saveConfig()">💾 Konfiguration speichern &amp; verbinden</button>
      </div>
      <div id="css-msg-slot"></div>

      <div style="font-size:15px;font-weight:800;margin-bottom:10px">Anmeldung</div>
      <div class="field" style="flex-direction:column;align-items:stretch;gap:4px">
        <label style="min-width:0">E-Mail</label>
        <input type="email" id="css-email" placeholder="du@example.com" autocomplete="email"
          value="${fb.user?fb.user.email:''}"/>
      </div>
      <div class="field" style="flex-direction:column;align-items:stretch;gap:4px">
        <label style="min-width:0">Passwort</label>
        <input type="password" id="css-pw" placeholder="mind. 6 Zeichen" autocomplete="current-password"/>
      </div>
      <div class="btnrow">
        <button class="btn btn-c" style="flex:1" onclick="CS_login()">🔑 Anmelden</button>
        <button class="btn btn-gh" onclick="CS_register()">+ Konto erstellen</button>
      </div>
      <div class="btnrow" style="margin-top:6px">
        <button class="btn btn-gh" style="border:none;font-size:13px" onclick="CS_logout()">Abmelden</button>
        <button class="btn btn-gh" style="border:none;font-size:13px" onclick="CS_reset()">Passwort vergessen?</button>
      </div>

      <div class="sep" style="margin:16px 0"></div>
      <div class="btnrow">
        <button class="btn btn-c" style="flex:1" onclick="CS_pushNow()" ${fb.user?'':'disabled style="flex:1;opacity:.4"'}>↑ Jetzt hochladen</button>
        <button class="btn btn-gh" style="flex:1" onclick="CS_pullNow()" ${fb.user?'':'disabled style="flex:1;opacity:.4"'}>↓ Jetzt laden</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:12px">
        <input type="checkbox" id="css-autosync" ${autoSyncOn()?'checked':''}
          onchange="CS_toggleAutoSync(this.checked)"
          style="width:18px;height:18px;accent-color:var(--cyan)"/>
        <label for="css-autosync" style="font-size:13px;font-weight:600">Auto-Sync aktiv</label>
        <span class="hint">${fb.user&&autoSyncOn()?'Auto-Sync läuft':fb.user?'Auto-Sync pausiert':''}</span>
      </div>
      ${lastSync?`<p class="hint" style="margin-top:8px">Letzter Sync: ${lastSync.toLocaleTimeString('de-DE')}</p>`:''}
      <p class="hint" style="margin-top:10px">Gleiche Config + gleiches Konto auf Mac und iPhone verwenden. Datenpfad: users/…/rebalgold.</p>`;
  };

  window.__csSettingsRefresh=function(){
    if(window.__getState&&window.__getState().tab===4)window.render();
  };

  window.CS_saveConfig=async function(){
    const raw=$('#css-fbcfg')?.value||'';
    const cfg=parseConfig(raw);
    if(!cfg||!cfg.apiKey||!cfg.projectId){
      showMsg('apiKey/projectId fehlen — bitte komplette Config aus der Firebase-Konsole einfügen (mit oder ohne { } — beides funktioniert).','err','css-msg-slot');
      return;
    }
    setConfigStore(cfg);
    showMsg('✓ Konfiguration gespeichert — verbinde…','ok','css-msg-slot');
    ready=false;fb={app:null,auth:null,db:null,user:null};
    const ok=await initFirebase();
    if(ok){toast('✓ Firebase verbunden');if(window.__csSettingsRefresh)window.__csSettingsRefresh();}
    else showMsg('Verbindung fehlgeschlagen — Config prüfen.','err','css-msg-slot');
  };
  window.CS_toggleAutoSync=function(on){
    setAutoSync(on);
    if(on&&fb.user)startRealtimeSync();
    else if(!on&&unsubDoc){unsubDoc();unsubDoc=null;}
    toast(on?'Auto-Sync aktiviert':'Auto-Sync pausiert');
    if(window.__csSettingsRefresh)window.__csSettingsRefresh();
  };
  window.CS_setTab=function(t){panelTab=t;if(window.__csSettingsRefresh)window.__csSettingsRefresh();};
  window.CS_login=async function(){
    if(!fb.auth){showMsg('Erst Konfiguration speichern &amp; verbinden.','err','css-msg-slot');return;}
    const email=$('#css-email')?.value.trim(),pw=$('#css-pw')?.value;
    if(!email||!pw){showMsg('Bitte E-Mail und Passwort eingeben.','err','css-msg-slot');return;}
    try{await fb.auth.signInWithEmailAndPassword(email,pw);toast('✓ Angemeldet');}
    catch(e){showMsg(fbErr(e),'err','css-msg-slot');}
  };
  window.CS_register=async function(){
    if(!fb.auth){showMsg('Erst Konfiguration speichern &amp; verbinden.','err','css-msg-slot');return;}
    const email=$('#css-email')?.value.trim(),pw=$('#css-pw')?.value;
    if(!email||!pw){showMsg('Bitte E-Mail und Passwort eingeben.','err','css-msg-slot');return;}
    if(pw.length<6){showMsg('Passwort muss mindestens 6 Zeichen haben.','err','css-msg-slot');return;}
    try{await fb.auth.createUserWithEmailAndPassword(email,pw);toast('✓ Konto erstellt');setTimeout(()=>CS_pushNow(),800);}
    catch(e){showMsg(fbErr(e),'err','css-msg-slot');}
  };
  window.CS_reset=async function(){
    const email=$('#css-email')?.value.trim();
    if(!email){showMsg('Bitte zuerst E-Mail eingeben.','info','css-msg-slot');return;}
    try{await fb.auth.sendPasswordResetEmail(email);showMsg('✓ E-Mail zum Zurücksetzen gesendet.','ok','css-msg-slot');}
    catch(e){showMsg(fbErr(e),'err','css-msg-slot');}
  };
  window.CS_logout=async function(){
    try{await fb.auth.signOut();toast('Abgemeldet');if(window.__csSettingsRefresh)window.__csSettingsRefresh();}catch(e){}
  };
  window.CS_pushNow=async function(){
    if(!fb.user||!window.__getState)return;
    const ref=userDocRef();if(!ref)return;
    syncing=true;updateFab();
    try{
      await ref.set({state:JSON.stringify(window.__getState()),_src:DEVICE_ID,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      lastSync=new Date();toast('☁ Hochgeladen');
    }catch(e){toast('⚠ Fehler');console.warn(e);}
    syncing=false;updateFab();
    if(overlay().classList.contains('open'))renderPanel();
  };
  window.CS_pullNow=async function(silent){
    if(!fb.user)return;
    const ref=userDocRef();if(!ref)return;
    syncing=true;updateFab();
    try{
      const snap=await ref.get();
      hasPulledOnce=true; // FIX v3.7
      if(snap.exists&&snap.data().state){
        applyCloudState(JSON.parse(snap.data().state));
        lastSync=new Date();
        if(!silent)toast('☁ Geladen');
      }else if(!silent)toast('Keine Cloud-Daten vorhanden');
    }catch(e){if(!silent)toast('⚠ Fehler');console.warn(e);}
    syncing=false;updateFab();
    if(overlay().classList.contains('open'))renderPanel();
  };

  function fbErr(e){
    const m={
      'auth/invalid-email':'Ungültige E-Mail-Adresse.',
      'auth/user-not-found':'Kein Konto mit dieser E-Mail.',
      'auth/wrong-password':'Falsches Passwort.',
      'auth/invalid-credential':'E-Mail oder Passwort falsch.',
      'auth/email-already-in-use':'E-Mail bereits registriert.',
      'auth/weak-password':'Passwort zu schwach (min. 6 Zeichen).',
      'auth/too-many-requests':'Zu viele Versuche. Später erneut.',
      'auth/network-request-failed':'Netzwerkfehler.',
      'auth/operation-not-allowed':'E-Mail/Passwort-Login in Firebase nicht aktiviert.'
    };
    return m[e.code]||('Fehler: '+(e.message||e.code||'unbekannt'));
  }

  document.getElementById('cs-overlay').addEventListener('click',function(e){
    if(e.target===this)this.classList.remove('open');
  });

  if(isConfigured()){initFirebase().then(ok=>{if(ok)updateFab();});}

})();
</script>
</body>
</html>
