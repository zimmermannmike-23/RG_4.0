<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zimmermann Capital · RebalGold</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg0:#000;--bg1:#0A0A0F;--bg2:#0d1a1f;--b:#1a2a2e;--t:#fff;--t2:#9CA3AF;--t3:#6B7280;
  --cyan:#00F0FF;--green:#39FF6A;--red:#FF1744;--yellow:#FFE600;--orange:#FF8A00;--rr:14px;--tab:64px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--t);font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
#backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background .4s}
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:var(--tab)}
#content{flex:1;padding:0 14px 28px;max-width:580px;margin:0 auto;width:100%}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;height:var(--tab);
  background:rgba(0,0,0,.96);border-top:1px solid rgba(0,240,255,.12);
  padding-bottom:env(safe-area-inset-bottom,0);backdrop-filter:blur(16px)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;border:none;background:none;color:var(--t3);font-size:9px;font-weight:700;padding:4px 2px;transition:color .2s}
.tb .ic{font-size:18px;line-height:1}
.tb.on{color:var(--tc,var(--cyan));text-shadow:0 0 12px var(--tg,rgba(0,240,255,.5))}
.card{background:var(--bg1);border:1px solid var(--b);border-radius:var(--rr);padding:16px;margin-bottom:12px}
.card-c{border-color:rgba(0,240,255,.4);box-shadow:0 0 18px rgba(0,240,255,.07),inset 0 0 18px rgba(0,240,255,.03)}
.card-y{border-color:rgba(255,230,0,.45);box-shadow:0 0 18px rgba(255,230,0,.08),inset 0 0 18px rgba(255,230,0,.03)}
.ctitle{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan);font-weight:700;margin-bottom:12px}
/* KZ TILES */
.kz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kz-tile{background:#040d10;border:1px solid var(--cyan);border-radius:12px;padding:14px 12px;
  box-shadow:0 0 14px rgba(0,240,255,.18),inset 0 0 14px rgba(0,240,255,.04)}
.kz-lbl{font-size:11px;color:var(--t2);line-height:1.3;margin-bottom:6px}
.kz-val{font-size:20px;font-weight:700;color:var(--cyan);font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(0,240,255,.5);line-height:1.2}
.kz-val.g{color:var(--green);text-shadow:0 0 12px rgba(57,255,106,.5)}
.kz-val.r{color:var(--red);text-shadow:0 0 12px rgba(255,23,68,.5)}
/* RINGS */
.gauge-wrap{display:flex;justify-content:center;margin:8px 0 14px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.mini-cell{display:flex;flex-direction:column;align-items:center;gap:5px}
.mini-lbl{font-size:9px;font-weight:700;color:var(--cyan);text-align:center;min-height:24px;display:flex;align-items:center;justify-content:center}
/* MONTH GRID */
.mog{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.mob{background:#040d10;border:1px solid rgba(0,240,255,.3);border-radius:10px;padding:8px 4px;text-align:center}
.mob.hi{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,240,255,.3)}
.mon{font-size:10px;font-weight:700;color:var(--t2);margin-bottom:2px}
.moa{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.mob.hi .moa{color:var(--cyan)}
/* PORTFOLIO */
.pf-row{display:flex;align-items:center;gap:8px;padding:14px;border:1px solid rgba(0,240,255,.35);border-radius:12px;margin-bottom:9px;cursor:pointer;background:var(--bg1)}
.pf-name{flex:1;font-size:15px;font-weight:700;color:var(--cyan)}
.pminus{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:var(--t2);font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
/* POSITIONS */
.pos-row{padding:12px 14px;border-bottom:1px solid var(--b);cursor:pointer}
.pos-row:last-child{border-bottom:none}
.pos-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pos-name{flex:1;font-size:14px;font-weight:700;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-bar{height:5px;border-radius:3px;background:var(--b);overflow:hidden;margin:4px 0;position:relative}
.pos-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;transition:width .6s}
.pos-bar-tgt{position:absolute;top:-3px;width:2px;height:11px;background:rgba(255,255,255,.4)}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:9999px;padding:4px 10px;font-size:11px;font-weight:700;flex-shrink:0}
.b-sofort{border:1.5px solid var(--red);color:var(--red)}
.b-pruefen{border:1.5px solid var(--yellow);color:var(--yellow)}
.b-ok{border:1.5px solid var(--green);color:var(--green)}
.b-aktiv{background:rgba(57,255,106,.15);border:1px solid var(--green);color:var(--green)}
/* TOGGLE */
.tog{width:44px;height:26px;border-radius:13px;border:none;cursor:pointer;position:relative;transition:background .25s;flex-shrink:0}
.tog.on{background:var(--cyan)}.tog.off{background:rgba(255,255,255,.15)}
.tog::after{content:'';position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:white;transition:left .25s}
.tog.on::after{left:21px}.tog.off::after{left:3px}
/* PILLS */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pill{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;
  border:1.5px solid rgba(0,240,255,.4);background:var(--bg2);color:var(--t2);transition:all .2s}
.pill.on{background:rgba(57,255,106,.15);border-color:var(--green);color:var(--green)}
/* MERKER SCROLL */
.merker-wrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.merker-wrap::-webkit-scrollbar{display:none}
.merker-tile{background:var(--bg2);border:2px solid var(--cyan);border-radius:12px;padding:14px;flex-shrink:0;min-width:145px;
  box-shadow:0 0 18px rgba(0,240,255,.2),inset 0 0 18px rgba(0,240,255,.05)}
.merker-lbl{font-size:10px;color:var(--cyan);font-weight:700;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.merker-inp{display:flex;align-items:center;gap:4px;background:#000;border:1px solid rgba(0,240,255,.4);border-radius:8px;padding:8px 10px}
.merker-inp input{background:none;border:none;color:var(--t);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;width:100%;outline:none;min-width:0}
.merker-inp span{color:var(--cyan);font-size:13px;flex-shrink:0}
/* SPARPLAN */
.spar-etf{background:var(--bg2);border:1px solid rgba(0,240,255,.3);border-radius:12px;padding:14px;margin-bottom:8px}
.spar-rate-row{display:flex;align-items:center;gap:8px;background:#000;border:1px solid rgba(0,240,255,.4);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.spar-rate-row input{background:none;border:none;color:var(--t);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;flex:1;outline:none;min-width:0}
/* ORDER CARDS */
.order-card{display:flex;align-items:center;gap:12px;padding:14px;background:#040d10;border:1px solid rgba(0,240,255,.3);border-radius:12px;margin-bottom:8px}
.order-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.buy-ic{background:rgba(57,255,106,.2);border:2px solid var(--green)}
.sell-ic{background:rgba(255,23,68,.2);border:2px solid var(--red)}
.order-info{flex:1;min-width:0}
.order-name{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:2px}
.order-sub{font-size:11px;color:var(--t2)}
.order-amt{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;color:var(--cyan)}
/* SETTINGS */
.acc{background:var(--bg1);border:1px solid rgba(255,230,0,.3);border-radius:var(--rr);margin-bottom:9px;overflow:hidden}
.acc.open{border-color:rgba(255,230,0,.55)}
.acc-h{display:flex;align-items:center;gap:10px;padding:15px;cursor:pointer}
.acc-ic{font-size:18px}.acc-t{flex:1;font-size:16px;font-weight:700;color:var(--yellow)}
.acc-ch{font-size:13px;color:var(--yellow);transition:transform .25s}
.acc.open .acc-ch{transform:rotate(180deg)}
.acc-b{display:none;padding:0 15px 15px;border-top:1px solid rgba(255,230,0,.1)}
.acc.open .acc-b{display:block}
/* FORMS */
.field{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.field label{font-size:12px;color:var(--t2);min-width:120px;flex-shrink:0}
.field input,.field select{flex:1;background:var(--bg0);border:1px solid var(--b);border-radius:8px;color:var(--t);padding:8px 10px;font-size:14px;min-width:0}
.field input:focus{outline:none;border-color:var(--cyan)}
.edf{background:var(--bg0);border:1px solid rgba(0,240,255,.3);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.edf label{font-size:12px;color:var(--t2);display:block;margin-bottom:4px}
.edf input{background:none;border:none;color:var(--t);font-size:17px;font-weight:700;width:100%;outline:none;font-variant-numeric:tabular-nums}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid;transition:all .2s}
.btn-c{background:rgba(0,240,255,.07);border-color:rgba(0,240,255,.4);color:var(--cyan)}
.btn-c:hover{background:rgba(0,240,255,.14)}
.btn-g{background:var(--green);border-color:var(--green);color:#000;font-weight:800}
.btn-gh{background:none;border-color:var(--b);color:var(--t2)}
.btn-r{background:rgba(255,23,68,.1);border-color:rgba(255,23,68,.4);color:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* BACK HEADER */
.back-hdr{display:flex;align-items:center;gap:10px;padding:16px 0 10px}
.back-btn{width:36px;height:36px;border-radius:50%;background:rgba(0,240,255,.1);border:1px solid rgba(0,240,255,.3);color:var(--cyan);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back-title{font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* YEAR PICKER */
.yr-pick{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.yr-pick span{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.yp-btn{width:36px;height:36px;border-radius:50%;background:var(--cyan);border:none;color:#000;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{padding:7px 5px;text-align:right;color:var(--t2);font-weight:600;border-bottom:1px solid var(--b);font-size:10px;white-space:nowrap}
.tbl th:first-child,.tbl th:nth-child(2){text-align:left}
.tbl td{padding:9px 5px;border-bottom:1px solid rgba(26,42,46,.6);vertical-align:middle;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{text-align:left;color:var(--cyan);font-weight:600}
.tbl td:nth-child(2){text-align:left;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.tbl tr:last-child td{border-bottom:none}
/* MODAL */
#modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0)}
#modal.open{display:flex}
.modal-box{background:var(--bg1);border:1px solid rgba(0,240,255,.4);border-radius:20px 20px 0 0;width:100%;max-width:580px;padding:20px 16px 24px;max-height:82vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;color:var(--cyan);margin-bottom:16px;text-align:center}
/* TOAST */
#toast{position:fixed;bottom:calc(var(--tab) + 14px);left:50%;transform:translateX(-50%) translateY(20px);background:rgba(57,255,106,.15);border:1px solid var(--green);border-radius:9999px;padding:8px 20px;font-size:13px;font-weight:700;color:var(--green);opacity:0;transition:all .3s;pointer-events:none;z-index:300;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sep{border:none;border-top:1px solid var(--b);margin:10px 0}
.sum-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.sum-row+.sum-row{border-top:1px solid var(--b)}
.hint{font-size:12px;color:var(--t3);line-height:1.5}
.stitle{text-align:center;font-family:'Pacifico',serif;font-weight:400;line-height:1.2;margin:18px 0 16px}
.gc{color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.7),0 0 24px rgba(0,240,255,.4)}
.gg{color:var(--green);text-shadow:0 0 10px rgba(57,255,106,.7),0 0 24px rgba(57,255,106,.4)}
.gy{color:var(--yellow);text-shadow:0 0 10px rgba(255,230,0,.7),0 0 24px rgba(255,230,0,.4)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.screen{animation:fadeUp .22s ease}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="app"><main id="content"></main><nav id="tabbar"></nav></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="json-file" accept=".json,application/json" style="display:none">

<script>
// ===== COLORS =====
const N={cyan:'#00F0FF',green:'#39FF6A',red:'#FF1744',yellow:'#FFE600',orange:'#FF8A00'};
const MN=['JAN','FEB','MÄR','APR','MAI','JUN','JUL','AUG','SEP','OKT','NOV','DEZ'];
const MNF=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const KLASSEN=['Globale Aktien','Schwellenländer','Anleihen','Dividenden/Covered','Tagesgeld'];
const APP_VERSION='3.20';
const APP_CHANGELOG=[
  {v:'3.20',d:'2026-09-18',t:'Jahrespruefungs-Prompt identifiziert die Fonds jetzt ausschliesslich ueber die ISIN. Die im Tool gespeicherten Fondsnamen und Kuerzel werden nicht mehr mitgegeben, weil sie fehlerhaft sein koennen (Beispiel: LU0292095535 ist als „Select Dividend 30" hinterlegt, gehoert aber zum Quality Dividend). Der Prompt fordert Claude ausdruecklich auf, jede ISIN nachzuschlagen, den amtlichen Namen samt Index, Replikation, Domizil, Waehrung und Volumen zu nennen und Abweichungen zu meinen Tabellenwerten zu melden; Alternativvorschlaege muessen ebenfalls eine ISIN tragen.'},
  {v:'3.19',d:'2026-09-18',t:'Sparrate wird jetzt unter den AKTIVEN ETF verteilt (Ziele untereinander normiert), waehrend Ampel, Score und Warnhinweise weiter ueber das gesamte Depot inkl. pausierter Positionen rechnen. Zuvor liefen beide ueber das Gesamtdepot, wodurch auch der unter den Aktiven bereits uebergewichtete ETF noch Geld bekam und die Angleichung statt einem Monat viele Monate gedauert haette. Neu ausserdem: Jahrespruefung — ab dem 1. Dezember erscheint ein Hinweis, die Gewichtung der einzelnen ETF zu pruefen und nach Alternativen zu suchen, samt fertigem Claude-Prompt mit Depotwert, Sparrate, Gewichten, TER, Ausschuettungen und Rendite je ETF. Einmal je Jahr quittierbar.'},
  {v:'3.18',d:'2026-09-18',t:'Pausierte ETF mit Bestand zaehlen jetzt durchgaengig zur Rechenbasis: pfTotal, effTarget, Abweichung, Ampel und Score beziehen sich auf das gesamte Depot, und Zielgewichte werden nicht mehr auf die aktiven Positionen hochnormiert. Zuvor verschwand ein ausgeschalteter ETF komplett aus der Rechnung — bei ausgeschaltetem XGSD meldete das Tool Score 84 und ein nahezu ausgeglichenes Depot, obwohl 76 % des Werts in dieser einen Position lagen. Die Sparrate fliesst weiterhin nur in aktive Positionen. Neue Zweitkennzahl „nur steuerbare ETF" zeigt den Fortschritt der monatlichen Sparraten, waehrend die Hauptampel den echten Depotzustand meldet. Pausierte Positionen ohne Bestand werden wie bisher herausnormiert.'},
  {v:'3.17',d:'2026-09-18',t:'Warnhinweis zur Wiederaufnahme pausierter ETF: die App berechnet jetzt fuer jede pausierte Position, nach wie vielen Sparraten ihr Anteil am GESAMTEN Depot wieder auf ihr Zielgewicht faellt, und meldet z.B. „LU0292096186 kann ab naechsten Monat wieder bespart werden". Dafuer neue Kennzahlen pfTotalAlle/posIstGesamt, die pausierte Positionen ausdruecklich mitzaehlen — die bisherigen pfTotal/posIst klammern sie aus und normieren auf die aktiven Positionen. Der Hinweis erscheint im Sparplan-Reiter, im Dashboard und direkt an der pausierten Position im Portfolio-Reiter.'},
  {v:'3.16',d:'2026-09-18',t:'Fehler behoben: das bei der Migration erzeugte Anfangs-Los trug zwar das Datum 01.09.2026, enthielt aber die heutige Stueckzahl — Kaeufe nach dem 01.09. steckten also bereits darin und qualifizierten faelschlich fuer frueher liegende Ex-Tage (z.B. DXSA/XGSD Zahltag 03.09. aus Ex-Tag 19.08.). Kaeufe lassen sich jetzt mit dem Haken „steckt bereits im Anfangsbestand" erfassen, wodurch der Anfangsbestand entsprechend reduziert statt aufgestockt wird; zusaetzlich ist der Anfangsbestand direkt editierbar. Die Naeherungs-Markierung (*) richtet sich jetzt nach dem Ex-Tag statt nach dem Zahlmonat, sodass auch September als Naeherung erkennbar ist.'},
  {v:'3.15',d:'2026-09-18',t:'Anzeige eindeutig auf den Zahltag bezogen: Betraege stehen im Monat, in dem das Geld ankommt, waehrend die Berechtigung weiterhin am Ex-Tag haengt. Die Aufstellung des gewaehlten Monats nennt je ETF den konkreten Zahltag (und den Ex-Tag), Prognosetermine sind als solche markiert, Tooltips fuehren jetzt mit dem Zahltag. Kartentitel umbenannt in „Monatliche Dividenden nach Zahltag".'},
  {v:'3.14',d:'2026-09-18',t:'Kachel „Zuwachs mtl. Dividende je Sparplan-Kauf" rechnet jetzt ausschliesslich mit der Sparrate des DIV ETF Depots. Zuvor wurde ersatzweise die Gesamtsparrate aller Depots herangezogen, wenn fuer das Depot selbst keine Rate hinterlegt war — das ueberzeichnete den Zuwachs deutlich. Ist keine Depot-Sparrate gesetzt, weist die Kachel darauf hin statt zu rechnen.'},
  {v:'3.13',d:'2026-09-18',t:'Kauflos-Tracking ab 01.09.2026: jede Position fuehrt jetzt datierte Kauflose statt nur einer Gesamtstueckzahl (Block KAEUFE (LOSE) im ETF-Detail, Erfassung per Datum, Stueckzahl oder Anlagebetrag). Stueckzahl und durchschnittlicher Kaufkurs leiten sich daraus ab. Der Dividendenkalender rechnet damit Ex-Datum-genau: nur Stuecke, die vor dem jeweiligen Ex-Tag im Depot lagen, zaehlen fuer eine Ausschuettung; Monate vor dem Erfassungsbeginn sind als Naeherung markiert (*). Ausserdem echte Ausschuettungsbetraege je Zahltermin 2026 fuer alle 7 ETF eingepflegt (statt geglaetteter Quartalsmittel) — dabei korrigiert: VGWD zahlte in der App faelschlich Jan/Apr/Jul/Okt statt tatsaechlich Apr/Jul/Sep/Dez.'},
  {v:'3.12',d:'2026-09-18',t:'Dividenden-Monatsauswahl: ein Klick auf einen Monat markiert ihn in allen Dividenden-Ansichten (Dashboard-Box, Je-ETF-Box, Depot-Reiter) und blendet eine Aufstellung aller ausschuettenden ETFs dieses Monats mit Summe ein; nochmal klicken hebt die Auswahl auf. Neue Kachel: durchschnittlicher Zuwachs der monatlichen Dividende je Sparplan-Kauf (Buy-Only-Verteilung der Sparrate, inkl. Jahreswert und Ausschuettungsrendite auf den Kauf).'},

// ===== HELPERS =====
function b64dec(s){try{return JSON.parse(atob(s.replace(/-/g,'+').replace(/_/g,'/')));}catch{return null;}}
function posVal(p){return(p.stueck||0)*(p.kurs||0);}
function posCost(p){return(p.stueck||0)*(p.kaufkurs||0);}
function pfAP(pf){return(pf.positions||[]).filter(p=>p.active);}
// Positionen, die zur Rechenbasis zaehlen: alle aktiven PLUS pausierte, in denen noch Geld steckt.
// Ein pausierter ETF verschwindet nicht aus dem Depot, nur weil er keine Sparrate mehr bekommt —
// sein Wert gehoert weiter zum Depotwert und sein Zielgewicht bleibt bestehen.
// Nur eine pausierte Position OHNE Bestand (reiner Platzhalter) wird herausgerechnet.
function pfZaehlend(pf){return(pf.positions||[]).filter(p=>p.active||posVal(p)>0);}
function pfTotal(pf){return pfZaehlend(pf).reduce((s,p)=>s+posVal(p),0);}

// Zielgewicht einer Position. Herausgerechnet werden nur pausierte Positionen ohne Bestand;
// deren Gewicht wird auf die verbleibenden hochskaliert. Pausierte Positionen MIT Bestand
// behalten ihr urspruengliches Ziel, damit die Uebergewichtung sichtbar bleibt.
function effTarget(p,pf){
  const z=pfZaehlend(pf);
  const sumRaw=z.reduce((s,x)=>s+x.target,0);
  if(sumRaw<=0)return p.target;
  return p.target/sumRaw*100;
}

function posIst(p,pf){const t=pfTotal(pf);return t>0?posVal(p)/t*100:0;}

// ===== GESAMTDEPOT-SICHT =====
// pfTotal()/posIst() klammern pausierte Positionen aus — fuer die Frage, wann ein pausierter
// ETF wieder besparbar ist, muss aber IMMER das gesamte Depot gerechnet werden, unabhaengig
// davon, ob die Position ein- oder ausgeschaltet ist.
function pfTotalAlle(pf){return(pf.positions||[]).reduce((s,p)=>s+posVal(p),0);}
function posIstGesamt(p,pf){const t=pfTotalAlle(pf);return t>0?posVal(p)/t*100:0;}
function posDevGesamt(p,pf){return posIstGesamt(p,pf)-(p.target||0);}

// Ab wann ist ein pausierter ETF wieder besparbar?
// Solange er pausiert ist, bleibt sein Wert stehen, waehrend das Depot um die Sparrate waechst.
// Sein Anteil am GESAMTdepot sinkt dadurch Monat fuer Monat. Gesucht ist die kleinste Zahl
// an Sparraten n, nach der sein Anteil wieder auf/unter sein urspruengliches Ziel faellt.
// Kursveraenderungen bleiben bewusst aussen vor — gerechnet wird mit den aktuellen Kursen.
function wiederBesparbarNach(p,pf){
  const ziel=p.target||0;
  if(ziel<=0)return null;
  const wert=posVal(p);
  const gesamt=pfTotalAlle(pf);
  if(gesamt<=0)return null;
  const ist=wert/gesamt*100;
  if(ist<=ziel)return{monate:0,ist,ziel,wert,gesamt};
  const sp=pf.sparAmount||0;
  if(!(sp>0))return{monate:null,ist,ziel,wert,gesamt,keineRate:true};
  // wert/(gesamt+n*sp)*100 <= ziel  ->  n >= (wert*100/ziel - gesamt)/sp
  const n=Math.ceil((wert*100/ziel-gesamt)/sp-1e-9);
  return{monate:Math.max(1,n),ist,ziel,wert,gesamt,sp,
         istDanach:wert/(gesamt+Math.max(1,n)*sp)*100};
}
// Alle pausierten Positionen eines Depots mit ihrer Wiederaufnahme-Prognose
function pausierteHinweise(pf){
  return(pf.positions||[]).filter(p=>p.active===false).map(p=>({pos:p,info:wiederBesparbarNach(p,pf)}))
    .filter(x=>x.info);
}
function monatsNameVersetzt(n){
  const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+n);
  return MNF[d.getMonth()]+' '+d.getFullYear();
}
function posDev(p,pf){return posIst(p,pf)-effTarget(p,pf);}
function pfMaxDev(pf){const z=pfZaehlend(pf);return z.length?Math.max(...z.map(p=>Math.abs(posDev(p,pf)))):0;}
// Zweite Kennzahl: Abweichung nur unter den ETF, die aktuell tatsaechlich bespart werden koennen.
// Sie zeigt den Fortschritt der monatlichen Sparraten, waehrend pfMaxDev den echten Depotzustand meldet.
function pfMaxDevSteuerbar(pf){
  const ap=pfAP(pf);
  if(!ap.length)return 0;
  const t=ap.reduce((s,p)=>s+posVal(p),0);
  const sumRaw=ap.reduce((s,x)=>s+x.target,0);
  if(t<=0||sumRaw<=0)return 0;
  return Math.max(...ap.map(p=>Math.abs(posVal(p)/t*100-p.target/sumRaw*100)));
}
function pfAmpelSteuerbar(pf){const d=pfMaxDevSteuerbar(pf);return d<2?'ok':d<5?'pruefen':'sofort';}
function pfScoreSteuerbar(pf){return Math.max(0,Math.min(100,Math.round(100-pfMaxDevSteuerbar(pf)*3)));}
function pfScore(pf){return Math.max(0,Math.min(100,Math.round(100-pfMaxDev(pf)*3)));}
function totalScore(){const s=state.portfolios.filter(p=>p.enabled).map(pfScore);return s.length?Math.round(s.reduce((a,b)=>a+b)/s.length):100;}
function pfAmpel(pf){const d=pfMaxDev(pf);return d<2?'ok':d<5?'pruefen':'sofort';}
function scoreColor(s){return s>=90?N.green:s>=75?N.cyan:s>=55?N.orange:N.red;}
function ampelBadge(a){
  const m={ok:{c:N.green,t:'● OK',cl:'b-ok'},pruefen:{c:N.yellow,t:'● PRÜFEN',cl:'b-pruefen'},sofort:{c:N.red,t:'● SOFORT',cl:'b-sofort'}};
  const r=m[a]||m.sofort;return`<span class="badge ${r.cl}">${r.t}</span>`;
}
// Gibt alle Positionen global zurück — dedupliziert nach ISIN.
// Gleiche ISIN in mehreren Portfolios = selbe physische Position → nur einmal zählen.
function uniquePositions(){
  const seen=new Set();
  const result=[];
  state.portfolios.forEach(pf=>{
    if(!pf.enabled)return;
    pf.positions.forEach(pos=>{
      if(!pos.name)return;
      const key=pos.isin&&pos.isin.trim()?pos.isin.trim():null;
      if(key){
        if(seen.has(key))return; // Duplikat überspringen
        seen.add(key);
      }
      result.push({pos,pfName:pf.name});
    });
  });
  return result;
}
// FIX v3.5: Deduplizierte Summe über eine Teilmenge von Portfolios (nach Namen).
// Verhindert Doppelzählung von Positionen, die in mehreren Portfolios liegen.
function uniqueValueOf(pfNames){
  const seen=new Set();let sum=0;
  state.portfolios.forEach(pf=>{
    if(!pf.enabled)return; // deaktivierte Depots fließen nicht in Ziele ein
    if(!pfNames.includes(pf.name))return;
    pf.positions.forEach(pos=>{
      const key=(pos.isin||'').trim();
      if(key){if(seen.has(key))return;seen.add(key);}
      sum+=posVal(pos);
    });
  });
  return sum;
}
function allTotal(){return uniquePositions().reduce((s,{pos})=>s+posVal(pos),0);}
function allCost(){return uniquePositions().reduce((s,{pos})=>s+posCost(pos),0);}
// FIX v3.5: TER-Kosten nur über aktivierte Portfolios und ohne Doppelzählung
function allTerCost(){return uniquePositions().reduce((s,{pos})=>s+posVal(pos)*(pos.ter||0)/100,0);}
function monthlyDivs(year){
  const d=Array(12).fill(0);
  uniquePositions().forEach(({pos})=>{
    for(let i=0;i<12;i++)d[i]+=posDivMonat(pos,year,i);
  });
  return d;
}

// Alle Ausschuettungen, deren Geld in Monat m (1-12) ankommt.
function ausschuettungenZahlmonat(ticker,m){

  return c.items.filter(x=>+x.pay.slice(5,7)===m);
}
// Faellt ein Sparplan-Kauf am KAUFTAG des Ex-Monats noch vor den Ex-Tag?
function exDatumKipp(ticker,monat){
  const c=AUSSCHUETTUNGEN_2026[ticker];if(!c)return[];
  return c.items.filter(x=>+x.pay.slice(5,7)===monat).map(x=>{

function exDatumHatKipppunkt(ticker){

  return c.items.some(x=>KAUFTAG>=+x.ex.slice(8,10));
}

// ===== KAUFLOS-TRACKING (ab 01.09.2026) =====
// Jede Position fuehrt eine Liste datierter Lose statt nur einer Gesamtstueckzahl:
//   lots:[{d:'2026-09-01',stueck:14.1685,kurs:40.20,typ:'anfang'},{d:'2026-10-04',...,typ:'kauf'}]
// Das Los 'anfang' buendelt den gesamten Bestand zum Erfassungsbeginn — fuer die Zeit davor
// existiert keine Kaufhistorie, das ist so gewollt und wird in der Anzeige gekennzeichnet.
const TRACKING_START='2026-09-01';
function posLots(pos){return Array.isArray(pos.lots)?pos.lots:[];}
function lotsSortiert(pos){return posLots(pos).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);}
function lotsStueck(pos){return posLots(pos).reduce((s,l)=>s+(l.stueck||0),0);}
// Stuecke, die VOR dem Stichtag (Ex-Tag) bereits im Depot lagen — nur die sind dividendenberechtigt.
function lotsStueckVor(pos,datum){return posLots(pos).filter(l=>l.d<datum).reduce((s,l)=>s+(l.stueck||0),0);}
function lotsAnfangsbestand(pos){const l=posLots(pos).find(x=>x.typ==='anfang');return l?(l.stueck||0):(pos.stueck||0);}
// Anfangsbestand direkt setzen (z.B. nach Abgleich mit dem Depotauszug vom Erfassungsstichtag)
function setzeAnfangsbestand(pfI,posI,stk){
  const pos=state.portfolios[pfI]?.positions[posI];if(!pos)return;
  let l=posLots(pos).find(x=>x.typ==='anfang');
  if(!l){l={d:TRACKING_START,stueck:0,kurs:pos.kaufkurs||pos.kurs||0,typ:'anfang'};pos.lots=[l,...posLots(pos)];}
  l.stueck=Math.max(0,stk||0);
  syncAusLosen(pos);render();showToast('Anfangsbestand gesetzt');
}
function lotsKaufkurs(pos){
  const st=lotsStueck(pos);if(st<=0)return pos.kaufkurs||0;
  return posLots(pos).reduce((s,l)=>s+(l.stueck||0)*(l.kurs||0),0)/st;
}
// Stueckzahl und Durchschnittskaufkurs aus den Losen zurueckschreiben (Lose sind die Wahrheit).
function syncAusLosen(pos){
  if(!posLots(pos).length)return;
  pos.stueck=lotsStueck(pos);
  pos.kaufkurs=lotsKaufkurs(pos);
}
function syncAlleLose(){state.portfolios.forEach(pf=>(pf.positions||[]).forEach(syncAusLosen));}
// Legt fehlende Lose an: gesamter Bestand als Anfangs-Los zum Erfassungsbeginn.
function initLose(){
  let n=0;
  state.portfolios.forEach(pf=>(pf.positions||[]).forEach(pos=>{
    if(!Array.isArray(pos.lots)||!pos.lots.length){
      pos.lots=[{d:TRACKING_START,stueck:pos.stueck||0,kurs:pos.kaufkurs||pos.kurs||0,typ:'anfang'}];
      n++;
    }
  }));
  return n;
}

// Dividendenbetrag einer Position fuer einen Zahlmonat — Ex-Datum-genau.
// Vor dem Erfassungsbeginn ist die Kaufhistorie unbekannt: dann wird mit dem Anfangsbestand
// gerechnet (nicht mit dem heutigen Bestand), damit spaetere Zukaeufe die Vergangenheit nicht aufblaehen.
function posDivMonat(pos,jahr,mIdx){
  const jeStk=((pos.divs||{})[jahr]||[])[mIdx]||0;
  if(!jeStk)return 0;
  const items=(jahr===2026)?ausschuettungenZahlmonat(pos.ticker,mIdx+1):[];
  if(!items.length||!posLots(pos).length)return jeStk*(pos.stueck||0);
  // Mehrere Ausschuettungen im selben Zahlmonat (QYLE): je Ex-Tag getrennt bewerten
  const summeBetrag=items.reduce((a,x)=>a+x.betrag,0);
  if(summeBetrag<=0)return jeStk*(pos.stueck||0);
  return items.reduce((sum,x)=>{
    const anteil=jeStk*(x.betrag/summeBetrag);          // hinterlegten Monatsbetrag auf die Termine verteilen
    const stk=(x.ex<TRACKING_START)?lotsAnfangsbestand(pos):lotsStueckVor(pos,x.ex);
    return sum+anteil*stk;
  },0);
}
// Beruht der Monatswert auf einem Ex-Tag VOR dem Erfassungsbeginn? Dann ist er nur eine Naeherung —
// unabhaengig davon, ob der Zahltag selbst schon im Erfassungszeitraum liegt.
function monatVorErfassung(jahr,mIdx,ticker){
  if(jahr!==2026){
    const ende=new Date(jahr,mIdx+1,0).toISOString().slice(0,10);
    return ende<TRACKING_START;
  }
  if(ticker){
    const items=ausschuettungenZahlmonat(ticker,mIdx+1);
    return items.length?items.some(x=>x.ex<TRACKING_START):false;
  }
  // Depotweit: Naeherung, sobald irgendein ETF in diesem Zahlmonat aus einem alten Ex-Tag zahlt
  return Object.keys(AUSSCHUETTUNGEN_2026).some(t=>
    ausschuettungenZahlmonat(t,mIdx+1).some(x=>x.ex<TRACKING_START));
}
// BUY-ONLY: buy_i = max(0, effTarget_i/100 × (T+sp) − val_i), dann auf sp skalieren
// ===== VERTEILUNG DER SPARRATE =====
// Bewertung (Ampel, Score, Warnhinweise) rechnet ueber das GESAMTE Depot inkl. pausierter
// Positionen — siehe pfTotal/effTarget. Die Sparrate wird dagegen unter den AKTIVEN Positionen
// verteilt, mit auf 100 % normierten Zielen untereinander. Grund: solange ein pausierter ETF
// stark uebergewichtet ist, sind alle aktiven gegenueber dem Gesamtdepot untergewichtet. Ihre
// Luecken unterscheiden sich dann kaum, und auch der unter den Aktiven bereits uebergewichtete
// ETF bekaeme noch Geld — die Angleichung der Aktiven untereinander dauert dadurch ein
// Vielfaches laenger. Bezogen auf die Aktiven greift die Buy-Only-Logik dagegen sofort.
function aktivBasis(pf){
  const ap=pfAP(pf);
  const t=ap.reduce((s,p)=>s+posVal(p),0);
  const sumRaw=ap.reduce((s,x)=>s+x.target,0);
  return{ap,t,sumRaw};
}
// Zielgewicht einer aktiven Position INNERHALB der aktiven Positionen (Summe = 100 %)
function aktivTarget(p,pf){
  const{sumRaw}=aktivBasis(pf);
  return sumRaw>0?p.target/sumRaw*100:p.target;
}
function aktivIst(p,pf){
  const{t}=aktivBasis(pf);
  return t>0?posVal(p)/t*100:0;
}
function buyOnlyOrdersMitRate(pf,sp){
  const{ap,t}=aktivBasis(pf);
  const tNew=t+sp;
  const raw=ap.map(p=>{
    const ist=aktivIst(p,pf),eff=aktivTarget(p,pf),dev=eff-ist;
    const buy=Math.max(0,(eff/100)*tNew-posVal(p));
    return{...p,ist,dev,effTgt:eff,buy,buyShares:p.kurs>0?buy/p.kurs:0};
  });
  const sum=raw.reduce((s,r)=>s+r.buy,0);
  const scale=(sum>sp&&sum>0)?sp/sum:1;
  raw.forEach(r=>{r.buy*=scale;r.buyShares=r.kurs>0?r.buy/r.kurs:0;});
  return raw;
}
function buyOnlyOrders(pf){
  return buyOnlyOrdersMitRate(pf,pf.sparAmount||state.sparrate);
}

// REBALANCING (mit Verkäufen): diff_i = effTarget_i/100 × T − val_i
function rebalancingOrders(pf){
  const t=pfTotal(pf);
  if(t<=0)return[];
  return pfAP(pf).map(p=>{
    const ist=posIst(p,pf),eff=effTarget(p,pf);
    const diff=(eff/100)*t - posVal(p);
    const shares=p.kurs>0?Math.abs(diff)/p.kurs:0;
    return{...p,ist,effTgt:eff,diff,shares,isBuy:diff>0};
  }).filter(o=>Math.abs(o.diff)>0.005);
}

// Minimum-Investition für vollständiges Buy-Only Ausgleichen
function fullRebalanceAmount(pf){
  const t=pfTotal(pf);
  const ap=pfAP(pf);
  const underweight=ap.filter(p=>posIst(p,pf)<effTarget(p,pf));
  const sumTgt=underweight.reduce((s,p)=>s+effTarget(p,pf)/100,0);
  const sumVal=underweight.reduce((s,p)=>s+posVal(p),0);
  const denom=1-sumTgt;
  if(denom<=0)return 0;
  return Math.max(0,(sumTgt*t-sumVal)/denom);
}

function svgRing({progress=0,color=N.cyan,size=100,lw=6,label='',sub=''}={}){
  const r=(size-lw*2)/2,c=size/2,ci=2*Math.PI*r;
  const off=ci*(1-Math.min(1,Math.max(0,progress)));

      stroke-linecap="round" stroke-dasharray="${ci}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${c} ${c})" filter="url(#gf${id})"
      style="animation:ringA .8s ease forwards"/>
    ${label?`<text x="${c}" y="${sub?c-4:c+1}" text-anchor="middle" dominant-baseline="middle"

  </svg><style>@keyframes ringA{from{stroke-dashoffset:${ci}}to{stroke-dashoffset:${off}}}</style>`;
}

if(!state.strategyV||state.strategyV<4)state.strategyV=4;


// ===== ZIELE-DASHBOARD: IST-Ermittlung (ausschliesslich aus ZIEL_PORTFOLIOS) =====
function zielPf(){return state.portfolios.find(p=>p.enabled&&ZIEL_PORTFOLIOS.includes(p.name))||null;}
function zPos(){const pf=zielPf();return pf?pf.positions:[];} // zeigt auch pausierte (active:false) ETFs
function zWert(){return zPos().reduce((s,p)=>s+(p.stueck||0)*(p.kurs||0),0);}
function zKosten(){return zPos().reduce((s,p)=>s+(p.stueck||0)*(p.kaufkurs||p.kurs||0),0);}
function zPerf(){const k=zKosten();return k>0?(zWert()-k)/k*100:0;}
function zDivJahr(y){return zPos().reduce((s,p)=>{let t=0;for(let i=0;i<12;i++)t+=posDivMonat(p,y,i);return s+t;},0);}
function zDivMonat(y,m){return zPos().reduce((s,p)=>s+posDivMonat(p,y,m),0);}
function zByTicker(t){return zPos().find(p=>p.ticker===t)||null;}
function zTerGew(){const w=zWert();if(w<=0)return 0;return zPos().reduce((s,p)=>s+(p.stueck*p.kurs/w)*(p.ter||0),0);}
function zRendGew(){const w=zWert();if(w<=0)return 0;
  return zPos().reduce((s,p)=>{const pv=p.stueck*p.kurs;const d=((p.divs||{})[HEUTE_J]||[]).reduce((a,v)=>a+(v||0),0);
    return s+(pv/w)*(p.kurs>0?d/p.kurs*100:0);},0);}
const HEUTE_J=new Date().getFullYear(), HEUTE_M=new Date().getMonth();
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

// Soll-Depotwert fuer ein Jahr (Sparphase beginnt 2027 — davor gilt das Startkapital)
function sollDepot(y){
  if(y<SOLL.sparStart)return SOLL.startkapital;
  const r=SOLL.jahre.find(x=>x[0]===y);return r&&r[3]!=null?r[3]:null;
}
function sollDivMonNetto(y){const r=SOLL.jahre.find(x=>x[0]===y);return r?r[2]:null;}

// ===== DARSTELLUNGS-HELFER =====
function pctBadge(ist,soll,invers){
  if(soll==null||soll===0)return '<span style="color:var(--t3)">–</span>';
  const d=(ist-soll)/Math.abs(soll)*100;
  const gut=invers?d<=0:d>=0;
  const c=Math.abs(d)<2?'var(--yellow)':(gut?'var(--green)':'var(--red)');
  return `<span style="color:${c};font-weight:700">${d>=0?'+':''}${d.toFixed(1)} %</span>`;
}
function dCell(ist,soll){
  if(ist==null||soll==null)return '<span style="color:var(--t3)">–</span>';
  const d=ist-soll;const c=Math.abs(d)<0.005?'var(--t2)':(d>=0?'var(--green)':'var(--red)');
  return `<span style="color:${c}">${d>=0?'+':''}${EUR0(d)}</span>`;
}

// Liniendiagramm Soll-Pfad mit Ist-Punkt
function svgPfad(rows,valIdx,istJahr,istWert,titel){
  const W=660,H=210,pl=52,pr=12,pt=16,pb=26;
  const pts=rows.filter(r=>r[valIdx]!=null).map(r=>({x:r[0],y:r[valIdx]}));
  if(!pts.length)return '';
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y).concat(istWert!=null?[istWert]:[]);
  const x0=Math.min(...xs,istJahr||Infinity),x1=Math.max(...xs),y1=Math.max(...ys)*1.06;
  const X=v=>pl+(v-x0)/((x1-x0)||1)*(W-pl-pr);
  const Y=v=>H-pb-(v/y1)*(H-pt-pb);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area=`${line} L${X(x1).toFixed(1)},${H-pb} L${X(pts[0].x).toFixed(1)},${H-pb} Z`;
  let grid='';
  for(let i=0;i<=3;i++){const v=y1*i/3;grid+=`<line x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}" stroke="#1a2a2e" stroke-width="1"/>
    <text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#6B7280">${v>=1000?(v/1000).toFixed(0)+'k':v.toFixed(0)}</text>`;}
  let xlab='';
  pts.forEach((p,i)=>{if(i%3===0||i===pts.length-1)xlab+=`<text x="${X(p.x)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6B7280">${p.x}</text>`;});
  const ist=(istWert!=null&&istJahr!=null)?
    `<circle cx="${X(istJahr).toFixed(1)}" cy="${Y(istWert).toFixed(1)}" r="5" fill="#00F0FF" stroke="#000" stroke-width="2"/>
     <text x="${X(istJahr).toFixed(1)}" y="${(Y(istWert)-11).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#00F0FF">Ist</text>`:'';
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto">
    <defs><linearGradient id="gp${valIdx}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39FF6A" stop-opacity=".22"/><stop offset="100%" stop-color="#39FF6A" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#gp${valIdx})"/>
    <path d="${line}" fill="none" stroke="#39FF6A" stroke-width="2.2" stroke-linejoin="round"/>
    ${ist}${xlab}</svg></div>
    <div class="hint" style="text-align:center;margin-top:2px">${titel} · <span style="color:var(--green)">Soll-Pfad</span> · <span style="color:var(--cyan)">Ist heute</span></div>`;
}

// Gruppiertes Balkendiagramm Soll vs Ist je ETF
function svgEtfBars(labels,sollArr,istArr,titel,einheit){
  const W=660,H=200,pl=44,pr=10,pt=14,pb=34,n=labels.length;
  const max=Math.max(...sollArr,...istArr.filter(v=>v!=null),0.0001)*1.12;
  const bw=(W-pl-pr)/n, bar=bw*0.32;
  const Y=v=>H-pb-(v/max)*(H-pt-pb);
  let grid='';
  for(let i=0;i<=3;i++){const v=max*i/3;grid+=`<line x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}" stroke="#1a2a2e"/>
    <text x="${pl-5}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#6B7280">${max>=1000?(v/1000).toFixed(0)+'k':v.toFixed(v<10?1:0)}</text>`;}
  let bars='';
  labels.forEach((lb,i)=>{
    const cx=pl+bw*i+bw/2, s=sollArr[i]||0, ist=istArr[i];
    bars+=`<rect x="${(cx-bar-2).toFixed(1)}" y="${Y(s).toFixed(1)}" width="${bar.toFixed(1)}" height="${Math.max(0,H-pb-Y(s)).toFixed(1)}" fill="#6B7280" rx="2"/>`;
    if(ist!=null)bars+=`<rect x="${(cx+2).toFixed(1)}" y="${Y(ist).toFixed(1)}" width="${bar.toFixed(1)}" height="${Math.max(0,H-pb-Y(ist)).toFixed(1)}" fill="#00F0FF" rx="2"/>`;
    bars+=`<text x="${cx.toFixed(1)}" y="${H-19}" text-anchor="middle" font-size="10" font-weight="700" fill="#9CA3AF">${lb}</text>`;
    if(ist!=null&&s>0){const d=(ist-s)/s*100;
      bars+=`<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="${Math.abs(d)<2?'#FFE600':(d>=0?'#39FF6A':'#FF1744')}">${d>=0?'+':''}${d.toFixed(0)}%</text>`;}
  });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:340px;height:auto">${grid}${bars}</svg></div>
  <div class="hint" style="text-align:center">${titel} · <span style="color:var(--t3)">■ Soll</span> <span style="color:var(--cyan)">■ Ist</span>${einheit?' · '+einheit:''}</div>`;
}

// Aktiv markierter Monat (0-11). Ohne Auswahl: laufender Monat, wenn das Kalenderjahr das aktuelle ist, sonst Januar.
function divAktiverMonat(){
  if(state.divSelMonth!==null&&state.divSelMonth>=0&&state.divSelMonth<12)return state.divSelMonth;
  return state.divCalYear===new Date().getFullYear()?new Date().getMonth():0;
}
// Monat anklicken: gleicher Monat erneut = Auswahl aufheben (zurueck auf Standard)
function divSetMonth(m){state.divSelMonth=(state.divSelMonth===m)?null:m;render();}

// Durchschnittliche Erhoehung der MONATLICHEN Dividende durch einen neuen Sparplan-Kauf.
// Basis: Buy-Only-Aufteilung der Sparrate des DIV-ETF-Depots auf die unterallokierten ETFs
// (identisch zur Sparplan-Empfehlung), je ETF gekaufte Stuecke × Jahresdividende/Stueck → /12.
// Buy-Only-Verteilung mit ausdruecklich uebergebener Rate — kein Rueckgriff auf die
// globale Gesamtsparrate state.sparrate, damit hier wirklich nur das DIV ETF Depot zaehlt.
// Zuwachs der monatlichen Dividende je Sparplan-Kauf — ausschliesslich DIV ETF Depot,
// ausschliesslich dessen eigene Sparrate (pf.sparAmount).
function divZuwachsProKauf(){
  const pf=zielPf();if(!pf)return null;
  const sp=pf.sparAmount||0;
  if(!(sp>0))return{pfName:pf.name,fehlendeRate:true};
  const orders=buyOnlyOrdersMitRate(pf,sp);
  let jahr=0;
  orders.forEach(o=>{
    const divStk=((o.divs||{})[state.divCalYear]||[]).reduce((a,b)=>a+(b||0),0);
    jahr+=(o.buyShares||0)*divStk;
  });
  return{pfName:pf.name,sp,jahr,monat:jahr/12,rendite:jahr/sp*100};
}

    </div>
    ${zw&&zw.fehlendeRate?`<div class="kz-tile" style="margin-top:10px">

    </div>`:''}
    ${zw&&!zw.fehlendeRate?`<div class="kz-tile" style="margin-top:10px">
      <div class="kz-lbl">Ø Zuwachs mtl. Dividende je Sparplan-Kauf · nur ${zw.pfName}</div>
      <div class="kz-val" style="color:${N.green}">+ ${EUR0(zw.monat)}<span style="font-size:13px;color:var(--t3)"> /Monat</span></div>
      <div style="font-size:12px;color:var(--t3);margin-top:2px">${EUR0(zw.sp)} Sparrate dieses Depots → + ${EUR0(zw.jahr)} Dividende p.a. · ${zw.rendite.toFixed(2)} % Ausschüttungsrendite auf den Kauf</div>
    </div>
    <p class="hint" style="margin-top:6px">Rechenweg: <b>nur die Sparrate des ${zw.pfName}</b> (${EUR0(zw.sp)}) nach Buy-Only-Logik auf dessen unterallokierte ETFs verteilt, je ETF gekaufte Stücke × Jahresausschüttung/Stück ${state.divCalYear}, geteilt durch 12. Die Gesamtsparrate aller Depots bleibt außen vor. Durchschnitt über alle Monate — die tatsächliche Gutschrift fällt nur in den Zahlmonaten an und beim ersten Zyklus je nach Ex-Datum ggf. später (siehe ⚠ unten).</p>`:''}

// Box 3 (neu): monatliche Dividende je ETF, exklusiv DIV ETF Depot — inkl. pausierter ETFs
function dividendeJeEtfBlock(){
  const sel=divAktiverMonat();
  const pos=zPos();
  // Aufstellung des gewaehlten Monats ueber alle ETFs
  const detail=pos.map(p=>{
    const items=(state.divCalYear===2026)?ausschuettungenZahlmonat(p.ticker,sel+1):[];
    return{
      ticker:p.ticker||p.name,
      paused:p.active===false,
      betrag:posDivMonat(p,state.divCalYear,sel),
      // Zahltag(e) dieses Monats — das ist der Tag, an dem das Geld auf dem Konto ist
      zahltage:items.map(x=>x.pay.split('-').reverse().join('.')).join(' · '),
      extage:items.map(x=>x.ex.split('-').reverse().join('.')).join(' · '),
      prognose:items.some(x=>x.status==='prognose')
    };
  }).filter(x=>x.betrag>0).sort((a,b)=>b.betrag-a.betrag);
  const detailSum=detail.reduce((s,x)=>s+x.betrag,0);
  return`<div class="card card-c">
    <div class="ctitle">MONATLICHE DIVIDENDE JE ETF · NACH ZAHLTAG · DIV ETF DEPOT</div>
    <p class="hint" style="margin-bottom:8px">Kalenderjahr ${state.divCalYear}, Beträge im Monat des <b>Zahltags</b> — berechtigt sind die Stücke, die vor dem jeweiligen <b>Ex-Tag</b> im Depot lagen. Auch pausierte ETFs (blass) werden angezeigt, sie bleiben Teil des Depots. Monat anklicken markiert ihn in allen Dividenden-Ansichten; nochmal klicken hebt die Auswahl auf.</p>

      <div class="kz-lbl">Aufstellung ${MNF[sel]} ${state.divCalYear}${state.divSelMonth!==null?' · gewählt':''}</div>
      ${detail.length?detail.map(x=>`<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:4px 0;opacity:${x.paused?.5:1}">
        <span><span style="color:var(--cyan)">${x.ticker}</span>${x.paused?' · pausiert':''}${x.zahltage?`<span style="color:var(--t3);font-size:11px"> · Zahltag ${x.zahltage}${x.prognose?' (Prognose)':''}</span>`:''}${x.extage?`<span style="color:var(--t3);font-size:11px;opacity:.7"> · Ex ${x.extage}</span>`:''}</span><span style="white-space:nowrap">${EUR0(x.betrag)}</span></div>`).join('')
        :`<div style="font-size:13px;color:var(--t3);padding:3px 0">Keine Ausschüttung in diesem Monat.</div>`}
      <div style="display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--line,#2a3a5a);margin-top:6px;padding-top:6px">
        <span>Summe</span><span style="color:${N.green}">${EUR0(detailSum)}</span></div>
    </div>
    ${pos.map(p=>{
      const paused=p.active===false;
      const md=Array(12).fill(0).map((_,i)=>posDivMonat(p,state.divCalYear,i));
      const sum=md.reduce((a,b)=>a+b,0);
      const kipp=state.divCalYear===2026&&exDatumHatKipppunkt(p.ticker);
      return`<div style="margin-bottom:12px;opacity:${paused?.5:1}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <span style="font-weight:700;color:var(--cyan)">${p.ticker||p.name}${paused?' · pausiert':''}${kipp?` <span title="Sparplan-Kauf am ${KAUFTAG}. fällt in mind. einem Monat auf/nach den Ex-Tag — Zukauf zählt dann erst zur Folgeausschüttung." style="color:${N.orange};font-weight:400;font-size:11px">⚠ Ex-Datum-Kipppunkt</span>`:''}</span>
          <span style="font-size:12px;color:var(--t2)">Ø ${EUR0(sum/12)}/Mon · Σ ${EUR0(sum)}/Jahr</span>
        </div>
        <div class="mog">${md.map((v,i)=>{
          const k=state.divCalYear===2026?exDatumKipp(p.ticker,i+1):[];
          const verschoben=k.some(x=>x.ergebnis==='verschoben');
          const titel=k.map(x=>`Zahltag ${x.pay.split('-').reverse().join('.')} — Ex-Tag ${x.ex.split('-').reverse().join('.')} (${x.status}): Kauf am ${KAUFTAG}. ${x.ergebnis==='treffer'?'zählt noch mit':'zählt erst zur nächsten Ausschüttung'}`).join(' · ');

}

function zieleBlock(){
  const pf=zielPf();
  if(!pf)return `<div class="card"><div class="ctitle">ZIELE · SOLL/IST</div>
    <p class="hint">Kein aktives Depot „${ZIEL_PORTFOLIOS[0]}" gefunden. Der Soll/Ist-Abgleich braucht dieses Depot eingeschaltet.</p></div>`;

  const wert=zWert(),kost=zKosten(),perf=zPerf();
  const sollHeute=sollDepot(HEUTE_J);
  const divIstJ=zDivJahr(HEUTE_J), divIstM=zDivMonat(HEUTE_J,HEUTE_M), divIstAvg=divIstJ/12;
  const sollJ=SOLL.jahre.find(r=>r[0]===HEUTE_J);
  const sollDivAvg=sollJ?sollJ[1]:null, sollDivJ=sollDivAvg!=null?sollDivAvg*12:null;
  const jahreBis=SOLL.zielJahr-HEUTE_J;
  const fortschritt=SOLL.szenarioA.depot>0?wert/SOLL.szenarioA.depot*100:0;
  const divFortschritt=SOLL.zielReal>0?divIstAvg/SOLL.zielReal*100:0;

  // Szenario-Einordnung 1-4 anhand der gewichteten Ausschuettungsrendite
  const rIst=zRendGew();
  const sc=[...SOLL.szenarien].sort((a,b)=>a.depot-b.depot);
  const einordnung=(()=>{
    // Ist-Rendite gegen die Renditeannahmen der Szenarien (3,5 / 5,0 / 7,0 / historisch ~9,5 TR)
    const trIst=SOLL.etfs.reduce((s,e)=>{const p=zByTicker(e.t);const w=p?p.stueck*p.kurs:0;return s+w*e.tr;},0)/(wert||1);
    if(trIst>=8.5)return{n:1,lb:'historisch (Basis)'};
    if(trIst>=6.0)return{n:4,lb:'Optimistisch 7,0 %'};
    if(trIst>=4.25)return{n:2,lb:'Basis 5,0 %'};
    return{n:3,lb:'Vorsichtig 3,5 %'};
  })();

  // KPI-Kacheln
  const kpi=(lb,val,sub,col)=>`<div style="flex:1;min-width:132px;background:var(--bg1);border:1px solid var(--b);border-radius:12px;padding:11px">
    <div style="font-size:10px;color:var(--t3);font-weight:700;letter-spacing:.5px">${lb}</div>
    <div style="font-size:19px;font-weight:800;color:${col||'var(--t)'};margin-top:3px">${val}</div>
    <div style="font-size:11px;color:var(--t2);margin-top:2px">${sub}</div></div>`;

  // Gewichte je ETF
  const gLabels=SOLL_T,gSoll=SOLL.etfs.map(e=>e.ziel);
  const gIst=SOLL_T.map(t=>{const p=zByTicker(t);return p&&wert>0?p.stueck*p.kurs/wert*100:null;});

  // Kurse je ETF
  const kSollRow=SOLL.kurse.find(r=>r[0]===HEUTE_J)||SOLL.kurse[0];
  const kIst=SOLL_T.map(t=>{const p=zByTicker(t);return p?p.kurs:null;});

  // Ausschuettungsrendite je ETF
  const rSoll=SOLL.etfs.map(e=>e.rend);
  const rIstArr=SOLL_T.map(t=>{const p=zByTicker(t);if(!p||!p.kurs)return null;
    return ((p.divs||{})[HEUTE_J]||[]).reduce((a,v)=>a+(v||0),0)/p.kurs*100;});

  const tblHead=s=>`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11px;min-width:${s}px">`;
  const th=t=>`<th style="text-align:right;padding:5px 4px;color:var(--t3);font-weight:700;border-bottom:1px solid var(--b);white-space:nowrap">${t}</th>`;
  const td=(t,c)=>`<td style="text-align:right;padding:4px;color:${c||'var(--t2)'};white-space:nowrap">${t}</td>`;

  // Jahrestabelle
  let jahrRows='';
  SOLL.jahre.forEach(r=>{
    const[y,brutto,netto,depot]=r;
    const isNow=y===HEUTE_J;
    const iD=(y===HEUTE_J)?wert:null, iDiv=(y===HEUTE_J)?divIstAvg:null;
    jahrRows+=`<tr style="border-bottom:1px solid rgba(26,42,46,.5)${isNow?';background:rgba(0,240,255,.07)':''}">
      ${td(`<strong style="color:${isNow?'var(--cyan)':'var(--t)'}">${y}</strong>`)}
      ${td(EUR0(netto))}${td(iDiv!=null?EUR0(iDiv):'–',iDiv!=null?'var(--cyan)':'var(--t3)')}
      ${td(iDiv!=null?pctBadge(iDiv,netto):'–')}
      ${td(depot!=null?EUR0(depot):'–')}${td(iD!=null?EUR0(iD):'–',iD!=null?'var(--cyan)':'var(--t3)')}
      ${td(iD!=null&&depot!=null?pctBadge(iD,depot):'–')}</tr>`;
  });

  // Monatstabelle
  let monRows='';
  SOLL.monate.forEach(r=>{
    const y=r[0],isNow=y===HEUTE_J;
    monRows+=`<tr style="border-bottom:1px solid rgba(26,42,46,.5)${isNow?';background:rgba(0,240,255,.07)':''}">
      ${td(`<strong style="color:${isNow?'var(--cyan)':'var(--t)'}">${y}</strong>`)}
      ${r.slice(1,13).map((v,i)=>{
        const ist=isNow?zDivMonat(y,i):null;
        return td(ist!=null?`${v}<br><span style="color:var(--cyan);font-weight:700">${ist.toFixed(0)}</span>`:v);
      }).join('')}
      ${td(`<strong>${r[13]}</strong>`,'var(--t)')}</tr>`;
  });

  // Depotwert je ETF / Jahresende
  let depotRows='';
  SOLL.depotJeEtf.forEach(r=>{
    depotRows+=`<tr style="border-bottom:1px solid rgba(26,42,46,.5)">${td(`<strong style="color:var(--t)">${r[0]}</strong>`)}
      ${r.slice(1,8).map(v=>td(EUR0(v))).join('')}${td(`<strong>${EUR0(r[8])}</strong>`,'var(--t)')}
      ${td(EUR0(r[9]))}${td(EUR0(r[10]),'var(--green)')}${td(r[11].toFixed(1)+' %','var(--green)')}</tr>`;
  });

  // Ausschuettungen je ETF / Jahr
  let ausRows='';
  SOLL.ausschJeEtf.forEach(r=>{
    ausRows+=`<tr style="border-bottom:1px solid rgba(26,42,46,.5)">${td(`<strong style="color:var(--t)">${r[0]}</strong>`)}
      ${r.slice(1,8).map(v=>td(EUR0(v))).join('')}${td(`<strong>${EUR0(r[8])}</strong>`,'var(--t)')}
      ${td(EUR0(r[9]))}${td(EUR0(r[10]),'var(--green)')}</tr>`;
  });

  // Kursentwicklung
  let kursRows='';
  SOLL.kurse.forEach(r=>{
    const isNow=r[0]===HEUTE_J;
    kursRows+=`<tr style="border-bottom:1px solid rgba(26,42,46,.5)${isNow?';background:rgba(0,240,255,.07)':''}">
      ${td(`<strong style="color:${isNow?'var(--cyan)':'var(--t)'}">${r[0]}</strong>`)}
      ${r.slice(1,8).map((v,i)=>{
        const p=isNow?zByTicker(SOLL_T[i]):null;
        return td(p?`${EUR0(v)}<br><span style="color:var(--cyan);font-weight:700">${EUR0(p.kurs)}</span>`:EUR0(v));
      }).join('')}</tr>`;
  });

  return `
  <div class="card">
    <div class="ctitle">ZIELE · SOLL/IST · ${pf.name}</div>
    <p class="hint" style="margin-bottom:10px">Soll-Basis: ${SOLL.quelle} (Stand ${SOLL.stand}). Ist-Werte ausschließlich aus „${pf.name}" — andere Depots fließen nicht ein.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      ${kpi('GESAMTKAPITAL',EUR0(wert),`Soll heute ${EUR0(sollHeute)} · ${pctBadge(wert,sollHeute)}`,'var(--cyan)')}
      ${kpi('PERFORMANCE',(perf>=0?'+':'')+perf.toFixed(2)+' %',`Einstand ${EUR0(kost)}`,perf>=0?'var(--green)':'var(--red)')}
      ${kpi('DIVIDENDE '+MON[HEUTE_M],EUR0(divIstM),`aktueller Monat`,'var(--green)')}
      ${kpi('Ø DIVIDENDE/MONAT',EUR0(divIstAvg),`Soll ${sollDivAvg!=null?EUR0(sollDivAvg):'–'} · ${sollDivAvg!=null?pctBadge(divIstAvg,sollDivAvg):'–'}`,'var(--green)')}
    </div>
    <div class="sep"></div>
    <div style="font-size:12px;font-weight:700;color:var(--t2);margin-bottom:8px">LAUFENDES JAHR ${HEUTE_J}</div>
    ${barPair('Ausschüttung Jahr',divIstJ,sollDivJ,' €')}
    ${barPair('Depotwert',wert,sollHeute,' €')}
    <div class="sep"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center">
      <div style="text-align:center">${svgRing({progress:Math.min(1,fortschritt/100),color:N.cyan,size:118,lw:10,label:fortschritt.toFixed(1)+'%',sub:'Kapitalziel'})}
        <div class="hint" style="margin-top:2px">${EUR0(wert)} von ${EUR0(SOLL.szenarioA.depot)}</div></div>
      <div style="text-align:center">${svgRing({progress:Math.min(1,divFortschritt/100),color:N.green,size:118,lw:10,label:divFortschritt.toFixed(1)+'%',sub:'Dividendenziel'})}
        <div class="hint" style="margin-top:2px">${EUR0(divIstAvg)} von ${EUR0(SOLL.zielReal)}/Mon</div></div>
      <div style="text-align:center">${svgRing({progress:Math.min(1,(HEUTE_J-2026)/(SOLL.zielJahr-2026)),color:N.yellow,size:118,lw:10,label:String(jahreBis),sub:'Jahre'})}
        <div class="hint" style="margin-top:2px">bis ${SOLL.zielJahr} · Sparende ${SOLL.sparEnde}</div></div>
    </div>
  </div>

  ${depotKennzahlenBlock()}
  ${jahresCheckBlock()}
  ${(()=>{const z=zielPf();return z?wiederaufnahmeBlock(z):'';})()}
  ${monatlicheDividendenBlock()}
  ${dividendeJeEtfBlock()}

  <div class="card">
    <div class="ctitle">ZIEL ${SOLL.zielJahr} · SZENARIO A</div>
    <p class="hint" style="margin-bottom:10px">Szenario A = Ausschüttungen fließen aus dem Depot ab. Der praktische Fall und Basis aller Zielzahlen.</p>
    ${[['Depotwert Sparende',SOLL.szenarioA.depot]]
      .map(([lb,v])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--b);font-size:13px">
        <span style="color:var(--t2)">${lb}</span><span style="font-weight:700;color:var(--t)">${EUR0(v)}</span></div>`).join('')}
    <div class="sep"></div>
    <div style="font-size:12px;font-weight:700;color:var(--t2);margin-bottom:6px">DECKUNG DES ZIELS (1.345,87 €/Monat real)</div>
    ${[['Ausschüttung Szenario A',SOLL.szenarioA.monat,SOLL.szenarioA.deckung],
       ['konstante Auszahlung mit Puffer',SOLL.puffer.konstant,SOLL.puffer.deckung]]
      .map(([lb,v,d])=>`<div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="color:var(--t)">${lb}</span><span style="font-weight:700;color:${d>=90?'var(--green)':'var(--yellow)'}">${EUR0(v)} · ${d} %</span></div>
        <div style="height:9px;background:var(--b);border-radius:5px;overflow:hidden">
          <div style="width:${d}%;height:100%;background:${d>=90?'var(--green)':'var(--yellow)'}"></div></div></div>`).join('')}
    <p class="hint" style="margin-top:8px">Vergleich Szenario W (volle Wiederanlage): ${EUR0(SOLL.szenarioW.depot)} Depotwert, ${EUR0(SOLL.szenarioW.monat)}/Monat. Differenz zu Szenario A ${EUR0(SOLL.szenarioW.depot-SOLL.szenarioA.depot)}.</p>
  </div>

  <div class="card">
    <div class="ctitle">SZENARIO-EINORDNUNG 1–4</div>
    <p class="hint" style="margin-bottom:10px">Gewichtete Total-Return-Annahme des aktuellen Depots gegen die vier Renditeszenarien der Datei (Annahmen!B7).</p>
    ${SOLL.szenarien.map(s=>{
      const on=s.n===einordnung.n;
      return `<div style="padding:9px 11px;margin-bottom:6px;border-radius:10px;border:1px solid ${on?'var(--cyan)':'var(--b)'};background:${on?'rgba(0,240,255,.09)':'var(--bg1)'}">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
          <span style="font-weight:700;font-size:13px;color:${on?'var(--cyan)':'var(--t)'}">${on?'▶ ':''}${s.n} · ${s.lb}</span>
          <span style="font-size:12px;color:var(--t2)">${EUR0(s.depot)} · ${EUR0(s.monNetto)}/Mon netto</span></div>
        <div class="hint" style="margin-top:2px">Rendite: ${s.rend} · kumuliert netto ${EUR0(s.kum)}</div></div>`;}).join('')}
    <p class="hint" style="margin-top:6px">Das Depot bewegt sich aktuell im Bereich <strong style="color:var(--cyan)">Szenario ${einordnung.n} — ${einordnung.lb}</strong>. Gewichtete Ausschüttungsrendite Ist ${rIst.toFixed(2)} % (Soll ${SOLL.renditeGew} %), gewichtete TER Ist ${zTerGew().toFixed(2)} % (Soll ${SOLL.terGew} %).</p>
  </div>

  <div class="card">
    <div class="ctitle">PROGNOSE · ENDVERMÖGEN &amp; DIVIDENDE</div>
    ${svgPfad(SOLL.jahre,3,HEUTE_J,wert,'Depotwert 2027–2041')}
    <div class="sep"></div>
    ${svgPfad(SOLL.jahre,2,HEUTE_J,divIstAvg,'Ø Dividende netto/Monat')}
    <div class="sep"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${kpi('DEPOTWERT 2041',EUR0(SOLL.szenarioA.depot),'Szenario A, Sparende 09/2041','var(--green)')}
      ${kpi('Ø DIVIDENDE/MON 2042',EUR0(SOLL.szenarioA.monat),'netto, Szenario A','var(--green)')}
      ${kpi('Ø DIVIDENDE/JAHR 2042',EUR0(SOLL.jahre[SOLL.jahre.length-1][2]*12),'netto','var(--green)')}
    </div>
  </div>

  <div class="card">
    <div class="ctitle">BLATT ANNAHMEN · EINGABEN JE ETF</div>
    ${svgEtfBars(gLabels,gSoll,gIst,'Gewichtung je ETF','in %')}
    <div class="sep"></div>
    ${svgEtfBars(gLabels,rSoll,rIstArr,'Ausschüttungsrendite je ETF','in %')}
    <div class="sep"></div>
    ${tblHead(660)}<thead><tr>${th('ETF')}${th('Stück Soll')}${th('Stück Ist')}${th('Kurs Soll')}${th('Kurs Ist')}${th('Wert Soll')}${th('Wert Ist')}${th('Ziel %')}${th('Ist %')}${th('TER Soll')}${th('TER Ist')}${th('Zahlmonate')}</tr></thead><tbody>
    ${SOLL.etfs.map((e,i)=>{const p=zByTicker(e.t);const w=p?p.stueck*p.kurs:null;
      return `<tr style="border-bottom:1px solid rgba(26,42,46,.5)">
        ${td(`<strong style="color:var(--cyan)">${e.t}</strong>`)}
        ${td(e.stueck.toFixed(4))}${td(p?p.stueck.toFixed(4):'–',p?'var(--cyan)':'var(--t3)')}
        ${td(EUR0(e.kurs))}${td(p?EUR0(p.kurs):'–',p?'var(--cyan)':'var(--t3)')}
        ${td(EUR0(e.wert))}${td(w!=null?EUR0(w):'–',w!=null?'var(--cyan)':'var(--t3)')}
        ${td(e.ziel.toFixed(1)+' %')}${td(gIst[i]!=null?gIst[i].toFixed(1)+' %':'–',gIst[i]!=null?'var(--cyan)':'var(--t3)')}
        ${td(e.ter.toFixed(2)+' %')}${td(p?(p.ter||0).toFixed(2)+' %':'–',p?'var(--cyan)':'var(--t3)')}
        ${td(e.zahl)}</tr>`;}).join('')}
    </tbody></table></div>
  </div>

  <div class="card">
    <div class="ctitle">JAHR FÜR JAHR BIS 2042</div>
    ${tblHead(560)}<thead><tr>${th('Jahr')}${th('Div Soll')}${th('Div Ist')}${th('Δ')}${th('Depot Soll')}${th('Depot Ist')}${th('Δ')}</tr></thead>
    <tbody>${jahrRows}</tbody></table></div>
    <p class="hint" style="margin-top:6px">Dividendenspalten sind Ø netto pro Monat. Ist-Werte erscheinen für das laufende Jahr; künftige Jahre füllen sich mit fortschreitender Zeit.</p>
  </div>

  <div class="card">
    <div class="ctitle">JEDER EINZELNE MONAT · 2027–2042</div>
    ${tblHead(700)}<thead><tr>${th('Jahr')}${MON.map(m=>th(m)).join('')}${th('Σ')}</tr></thead>
    <tbody>${monRows}</tbody></table></div>
    <p class="hint" style="margin-top:6px">Netto, gerundet. Im laufenden Jahr steht unter dem Soll-Wert der <span style="color:var(--cyan)">Ist-Wert</span>. Sechs der sieben Positionen zahlen quartalsweise — der Monatseingang schwankt deshalb stark.</p>
  </div>

  <div class="card">
    <div class="ctitle">DEPOTWERT JE ETF · JAHRESENDE</div>
    ${tblHead(760)}<thead><tr>${th('Jahr')}${SOLL_T.map(t=>th(t)).join('')}${th('Depot')}${th('Eingezahlt')}${th('Gewinn')}${th('%')}</tr></thead>
    <tbody>${depotRows}</tbody></table></div>
  </div>

  <div class="card">
    <div class="ctitle">AUSSCHÜTTUNGEN JE ETF UND JAHR (BRUTTO)</div>
    ${tblHead(700)}<thead><tr>${th('Jahr')}${SOLL_T.map(t=>th(t)).join('')}${th('Σ Jahr')}${th('Ø Mon')}${th('Ø netto')}</tr></thead>
    <tbody>${ausRows}</tbody></table></div>
  </div>

  <div class="card">
    <div class="ctitle">KURSENTWICKLUNG · ANTEILSPREIS (KURS-CAGR)</div>
    ${svgEtfBars(gLabels,kSollRow.slice(1,8),kIst,`Anteilspreis ${HEUTE_J} Soll vs. Ist`,'in €')}
    <div class="sep"></div>
    ${tblHead(620)}<thead><tr>${th('Jahr')}${SOLL_T.map(t=>th(t)).join('')}</tr></thead>
    <tbody>${kursRows}</tbody></table></div>
    <p class="hint" style="margin-top:6px">Nur der Anteilspreis, nicht der Depotwert: heutiger Kurs mal (1 + Kurs-CAGR) hoch Jahre. Im laufenden Jahr steht darunter der <span style="color:var(--cyan)">Ist-Kurs</span>.</p>
  </div>`;
}

function screenDashboard(){
  const sc=totalScore(),scC=scoreColor(sc),now=new Date().getMonth();
  const md=monthlyDivs(state.divCalYear),t=allTotal(),cb=allCost(),g=t-cb,yp=cb>0?g/cb*100:0;
  return`<div class="screen">
    <h1 class="stitle gg" style="font-size:42px">Dashboard</h1>
    ${zieleBlock()}
    ${checkDue()?`<div class="card" style="border-color:rgba(255,209,57,.55);background:rgba(255,209,57,.07)">
      <div class="ctitle" style="color:var(--yellow)">📤 MONATS-CHECK FÄLLIG</div>
      <div style="font-size:13px;line-height:1.6;margin-bottom:10px">
        Es ist der ${new Date().getDate()}. — Zeit für den Monats-Check.
        Exportiere dein JSON-Backup und lade es in Claude hoch: Positionen, Kurse,
        Dividendenmonate und der Zielpfad werden dann gegengeprüft.
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="checkExport()" style="flex:1;min-width:140px">JSON exportieren</button>
        <button class="btn btn-r" onclick="checkDone()" style="flex:0 0 auto">Erledigt</button>
      </div>
    </div>`:''}
    <div class="gauge-wrap">${svgRing({progress:sc/100,color:scC,size:220,lw:16,label:String(sc),sub:'Score'})}</div>
    <div class="card">
      <div class="ctitle">TEIL-PORTFOLIOS (REBALANCING &amp; SCORE)</div>
      <div class="mini-grid">${state.portfolios.filter(p=>p.enabled).map((pf,fi)=>{
        const idx=state.portfolios.indexOf(pf);
        const s=pfScore(pf),c=scoreColor(s);
        return`<div class="mini-cell" onclick="openPfFromDash(${idx})" style="cursor:pointer;transition:opacity .15s" onmousedown="this.style.opacity='.6'" onmouseup="this.style.opacity='1'">
          <div class="mini-lbl">${pf.name}</div>${svgRing({progress:s/100,color:c,size:86,lw:6,label:String(s)})}</div>`;
      }).join('')}</div>
    </div>
    <div class="card card-c">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px">Gesamtkapital</div>
          <div style="font-size:20px;font-weight:700" class="gc">${EUR0(t)}</div></div>
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px">Performance</div>
          <div style="font-size:20px;font-weight:700;color:${g>=0?N.green:N.red}">${yp.toFixed(2)}%</div></div>
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px">Div. ${MN[now]}</div>
          <div style="font-size:18px;font-weight:700" class="gc">${EUR0(md[now])}</div></div>
        <div><div style="font-size:11px;color:var(--t2);margin-bottom:3px">Div. ø / Monat</div>
          <div style="font-size:18px;font-weight:700" class="gc">${EUR0(md.reduce((a,b)=>a+b)/12)}</div></div>
      </div>
    </div>
    ${(()=>{
      const jetzt=new Date().getFullYear(), p=planFor(jetzt);
      const incVal=uniqueValueOf(ZIEL_PORTFOLIOS);
      const diff=incVal-p.income, ok=diff>=-p.income*0.05;
      const jahreRest=Math.max(0,ZIELJAHR-jetzt);
      const pct=Math.min(100,incVal/ZIEL_INCOME*100);
      return`<div class="card" style="border-color:rgba(255,209,57,.35)">
        <div class="ctitle" style="color:var(--yellow)">ZIELPFAD ${jetzt} → ${ZIELJAHR}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px">

// ══ DEPOTAUSZUG-IMPORT (Trade Republic Vermögensübersicht) ════════════════
// Liest Stückzahlen und Kurse aus dem kopierten Text des PDF-Auszugs.
// Robust gegen: ganzzahlige Bestände ("2 Stk."), Tausenderpunkte (10.572,89),
// Datumsangaben in Kursspalten und ISINs auf beliebiger Folgezeile.
function trNum(x){
  if(x==null)return NaN;
  x=String(x).trim();
  if(!/^\d{1,3}(\.\d{3})*(,\d+)?$|^\d+(,\d+)?$/.test(x))return NaN;
  return parseFloat(x.replace(/\./g,'').replace(',','.'));
}
function parseTR(text){
  const rows=[],warn=[];
  if(!text||!text.trim())return{rows,warn:['Kein Text eingefügt.']};
  const lines=text.replace(/\r/g,'').split('\n');
  const STK=/(^|\s)(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s*Stk\./;
  const ISIN=/ISIN:\s*([A-Z]{2}[A-Z0-9]{9}[0-9])/;
  const NUM=/(?:^|\s)(\d{1,3}(?:\.\d{3})*,\d{2})(?=\s|$)/g;
  const starts=[];lines.forEach((l,i)=>{if(STK.test(l))starts.push(i);});
  if(!starts.length)return{rows,warn:['Keine Positionen gefunden — wurde der Wertpapier-Teil mitkopiert?']};
  for(let b=0;b<starts.length;b++){
    const from=starts[b],to=(b+1<starts.length?starts[b+1]:lines.length);
    const block=lines.slice(from,to).join('\n'),head=lines[from];
    const mS=head.match(STK);if(!mS)continue;
    const stueck=trNum(mS[2]);
    const mI=block.match(ISIN);
    if(!mI){warn.push('Ohne ISIN übersprungen: '+head.trim().slice(0,42));continue;}
    const tail=head.slice(head.indexOf('Stk.')+4).replace(/\d{2}\.\d{2}\.\d{4}/g,' ');
    let pool=(tail.match(NUM)||[]).map(v=>trNum(v.trim())).filter(n=>!isNaN(n));
    if(pool.length<2){
      const t2=block.replace(/\d{2}\.\d{2}\.\d{4}/g,' ').replace(ISIN,' ');
      pool=(t2.match(NUM)||[]).map(v=>trNum(v.trim())).filter(n=>!isNaN(n));
    }
    let kurs=NaN,wert=NaN,best=Infinity;
    for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){
      const d=Math.abs(pool[i]*stueck-pool[j]);
      if(d<best){best=d;kurs=pool[i];wert=pool[j];}
    }
    if(!(best<=Math.max(0.02,(wert||0)*0.005))){if(pool.length)kurs=pool[0];wert=NaN;}
    if(isNaN(stueck)||isNaN(kurs)){warn.push(mI[1]+': Stück oder Kurs unlesbar');continue;}
    rows.push({isin:mI[1],stueck,kurs,wert:isNaN(wert)?null:wert});
  }
  return{rows,warn};
}
let _trRows=null;
function openTRModal(){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-box">
    <div class="modal-title">📄 Depotauszug importieren</div>
    <p class="hint" style="margin-bottom:10px">Trade-Republic-Vermögensübersicht als PDF öffnen · alles markieren · kopieren · hier einfügen. Übernommen werden <strong>Stückzahlen und Kurse</strong>, zugeordnet über die ISIN.</p>
    <div class="field"><label>Text aus dem Auszug</label>
      <textarea id="tr_txt" rows="5" placeholder="4,893074 Stk.  Automation &amp; Robotics …&#10;ISIN: IE00BYWZ0333 …"
        style="width:100%;background:var(--bg2);color:var(--t1);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px;font-size:12px;font-family:monospace"></textarea></div>
    <div class="btnrow">
      <button class="btn btn-c" style="flex:1" onclick="trAnalyse()">🔍 Analysieren</button>
      <button class="btn btn-gh" onclick="closeModal()">Abbrechen</button>
    </div>
    <div id="tr_out" style="margin-top:12px"></div>
  </div>`;
  m.classList.add('open');
  m.onclick=e=>{if(e.target===m)closeModal();};
}
function trAnalyse(){
  const txt=document.getElementById('tr_txt')?.value||'';
  const {rows,warn}=parseTR(txt);
  const out=document.getElementById('tr_out');
  if(!rows.length){out.innerHTML=`<div class="hint" style="color:var(--red)">✕ ${warn[0]||'Nichts erkannt.'}</div>`;return;}
  const inApp=new Map();
  state.portfolios.forEach(pf=>pf.positions.forEach(p=>{
    const k=(p.isin||'').trim(); if(k&&!inApp.has(k))inApp.set(k,p);
  }));
  const treffer=[],neu=[];
  rows.forEach(r=>{
    const p=inApp.get(r.isin);
    if(!p){neu.push(r);return;}
    // Kaufkurs fortschreiben: gewichteter Durchschnitt bei Zukauf.
    // Verkauf laesst den Einstand unveraendert (steuerliche Konvention).
    const zu = r.stueck - p.stueck;
    const kkAlt = p.kaufkurs || 0;
    let kkNeu = kkAlt;
    if(zu > 1e-6 && kkAlt > 0 && r.stueck > 0)
      kkNeu = (p.stueck*kkAlt + zu*r.kurs) / r.stueck;
    treffer.push({...r,name:p.name,stueckAlt:p.stueck,kursAlt:p.kurs,
      kkAlt, kkNeu, zu,
      chg:(Math.abs(p.stueck-r.stueck)>1e-6)||(Math.abs(p.kurs-r.kurs)>1e-4)});
  });
  const fehlt=[...inApp.keys()].filter(k=>!rows.some(r=>r.isin===k));
  _trRows=treffer;
  const zeilen=treffer.filter(t=>t.chg).map(t=>{
    const ds=Math.abs(t.stueckAlt-t.stueck)>1e-6?`<span style="color:var(--yellow)">${t.stueckAlt} → ${t.stueck}</span>`:`${t.stueck}`;
    const dk=Math.abs(t.kursAlt-t.kurs)>1e-4?`<span style="color:var(--yellow)">${t.kursAlt.toFixed(2)} → ${t.kurs.toFixed(2)} €</span>`:`${t.kurs.toFixed(2)} €`;
    const dkk = (t.zu>1e-6 && Math.abs(t.kkNeu-t.kkAlt)>1e-4)
      ? `<div style="color:var(--green)">↗ Zukauf ${t.zu.toFixed(6)} Stk · Einstand ${t.kkAlt.toFixed(2)} → ${t.kkNeu.toFixed(2)} €</div>`
      : (t.zu<-1e-6 ? `<div style="color:var(--yellow)">↘ Verkauf ${Math.abs(t.zu).toFixed(6)} Stk · Einstand unverändert</div>` : '');
    return `<div style="font-size:11px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)">
      <div style="color:var(--t1)">${t.name.slice(0,40)}</div>
      <div style="color:var(--t2)">Stk ${ds} · Kurs ${dk}</div>${dkk}</div>`;
  }).join('')||'<div class="hint">Alle Werte sind bereits aktuell.</div>';
  out.innerHTML=`
    <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <div style="flex:1;min-width:80px;background:rgba(0,240,255,.08);border-radius:8px;padding:8px;text-align:center">
        <div style="font-size:17px;font-weight:700">${treffer.length}</div><div style="font-size:10px;color:var(--t2)">zugeordnet</div></div>
      <div style="flex:1;min-width:80px;background:rgba(255,209,57,.08);border-radius:8px;padding:8px;text-align:center">
        <div style="font-size:17px;font-weight:700">${treffer.filter(t=>t.chg).length}</div><div style="font-size:10px;color:var(--t2)">geändert</div></div>
      <div style="flex:1;min-width:80px;background:rgba(255,255,255,.05);border-radius:8px;padding:8px;text-align:center">
        <div style="font-size:17px;font-weight:700">${neu.length}</div><div style="font-size:10px;color:var(--t2)">nicht in App</div></div>
    </div>
    ${fehlt.length?`<div class="hint" style="color:var(--yellow);margin-bottom:6px">⚠ ${fehlt.length} Position(en) der App fehlen im Auszug: ${fehlt.join(', ')}</div>`:''}
    ${warn.length?`<div class="hint" style="margin-bottom:6px">${warn.slice(0,3).map(w=>'· '+w).join('<br>')}</div>`:''}
    <div style="max-height:190px;overflow-y:auto;margin-bottom:10px">${zeilen}</div>
    <label style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t2);margin-bottom:8px;cursor:pointer">
      <input type="checkbox" id="tr_kk" checked style="width:16px;height:16px;accent-color:var(--green)"/>
      Einstandskurse bei Zukäufen fortschreiben (${treffer.filter(t=>t.zu>1e-6&&Math.abs(t.kkNeu-t.kkAlt)>1e-4).length} betroffen)
    </label>
    <button class="btn btn-g" style="width:100%" onclick="trApply()">✓ ${treffer.filter(t=>t.chg).length} Änderung(en) übernehmen</button>`;
}
function trApply(){
  if(!_trRows){showToast('Bitte zuerst analysieren');return;}
  const mitKK = document.getElementById('tr_kk')?.checked !== false;
  let n=0,k=0;
  _trRows.forEach(t=>{
    state.portfolios.forEach(pf=>pf.positions.forEach(p=>{
      if((p.isin||'').trim()===t.isin){
        if(Math.abs(p.stueck-t.stueck)>1e-6||Math.abs(p.kurs-t.kurs)>1e-4)n++;
        p.stueck=t.stueck; p.kurs=t.kurs;
        if(mitKK && t.zu>1e-6 && Math.abs(t.kkNeu-t.kkAlt)>1e-4){
          p.kaufkurs=Math.round(t.kkNeu*10000)/10000; k++;
        }
      }
    }));
  });
  saveState(); closeModal(); render();
  showToast(`✓ ${n} Position(en) aktualisiert${k?` · ${k} Einstand fortgeschrieben`:''}`);
}

const CHECK_KEY='rebalgold_monatscheck';
function checkDue(){
  const d=new Date(), tag=d.getDate();
  const monat=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');

}

function renderRebalancingCard(pf){

  return`<div class="card" style="border-color:rgba(0,240,255,.4)">

      : ro.map(o=>`
        <div class="order-card">
          <div class="order-icon ${o.isBuy?'buy-ic':'sell-ic'}">${o.isBuy?'↓':'↑'}</div>

          </div>
          <div class="order-amt" style="color:${o.isBuy?N.green:N.red}">${EUR0(Math.abs(o.diff))}</div>

    ${ro.length>0?`

    <div class="sum-row"><span style="color:var(--red)">Verkäufe</span><span style="font-weight:700;color:var(--red)">${EUR0(totalSell)}</span></div>

}

  return`Du bist mein Anlage-Sparringspartner für mein privates Dividenden-ETF-Depot. Bitte prüfe kritisch — ich will Widerspruch, keine Bestätigung.

## Identifikation der Fonds — bitte zuerst lesen
Alle Positionen sind ausschließlich über die **ISIN** angegeben. Verwende nur die ISIN, um den jeweiligen Fonds zu bestimmen; verlasse dich nicht auf Namen oder Kürzel, die ich sonst irgendwo verwende, und rate keinen Namen aus der ISIN. Schlage jede ISIN nach und nenne mir zu Beginn deiner Antwort je ISIN den vollständigen amtlichen Fondsnamen, den Emittenten, den abgebildeten Index, die Replikationsmethode, das Fondsdomizil, die Fondswährung und das Fondsvolumen. Stimmt etwas davon nicht mit den Zahlen in meiner Tabelle überein (z. B. die TER), sage es mir ausdrücklich.
Ebenso gilt für alle Alternativvorschläge: nenne immer die ISIN, nicht nur den Namen.

## Aufgabe
1. Prüfe die Gewichtung der ETF untereinander: Ist die Aufteilung für ein Dividenden-Depot sinnvoll, oder gibt es Klumpenrisiken (Regionen, Sektoren, Einzeltitel-Überschneidungen zwischen den ETF)?
2. Prüfe Überschneidungen: Welche ETF halten weitgehend dieselben Titel? Wo zahle ich doppelt TER für dasselbe Exposure?

4. Bewerte kritisch, ob Covered-Call-Produkte (in meinem Depot: IE00BM8R0J59) in dieser Gewichtung sinnvoll sind — insbesondere das Verhältnis von Ausschüttungshöhe zu Substanzverzehr und Kursentwicklung.
5. Sage mir klar, wenn du etwas für einen Fehler hältst. Wenn du etwas nicht weißt, sag es, statt zu schätzen.

## Mein Depot (Stand ${new Date().toLocaleDateString('de-DE')})
Depotwert: ${gesamt.toFixed(2)} €
Monatliche Sparrate: ${sp.toFixed(2)} €
${zw&&!zw.fehlendeRate?`Zuwachs monatliche Ausschüttung je Sparplan-Kauf: ${zw.monat.toFixed(2)} € (${zw.rendite.toFixed(2)} % Ausschüttungsrendite auf den Kauf)`:''}
Ausschüttungen ${state.divCalYear}: ${divJahr.toFixed(2)} € gesamt, im Schnitt ${(divJahr/12).toFixed(2)} € pro Monat
Ausschüttungsrendite des Depots: ${gesamt>0?(divJahr/gesamt*100).toFixed(2):'-'} %
${z.zielSumme?`Zielsumme: ${(+z.zielSumme).toFixed(0)} €`:''}${z.zielJahr?` bis ${z.zielJahr}`:''}
Anlagehorizont: Ruhestand 2041

| ISIN | Wert | Ist-% | Ziel-% | Abw. | TER | Aussch./Anteil ${state.divCalYear} | Rendite | Status |
|---|---|---|---|---|---|---|---|---|
${zeilen}

## Rahmenbedingungen
- Privatanleger in Deutschland, Broker Trade Republic, Abgeltungsteuer nach FIFO
- Sparplan-Käufe monatlich zwischen dem 2. und 4.
- Ziel ist ein wachsender, planbarer Ausschüttungsstrom bis zum Ruhestand; Kurssteigerung ist zweitrangig, aber Substanzverzehr soll vermieden werden
- Ein Umschichten bestehender Positionen löst Abgeltungsteuer auf Buchgewinne aus — berücksichtige das bei Empfehlungen und unterscheide zwischen "künftige Sparraten umlenken" und "bestehende Position verkaufen"
- Du bist kein Anlageberater und ich erwarte keine Anlageberatung, sondern eine fachliche Einschätzung, die ich selbst prüfe

## Format
Antworte strukturiert: erst die aus deiner Sicht gravierendsten Befunde, dann die Detailanalyse je ETF, zum Schluss eine priorisierte Liste konkreter Handlungsoptionen mit jeweiliger Begründung und Gegenargument. Recherchiere aktuelle Daten (TER, Fondsvolumen, Ausschüttungshistorie), statt dich auf dein Gedächtnis zu verlassen.`;

// Kurs einer Position aktualisieren — propagiert auf alle Positionen mit gleicher ISIN
function updatePriceByISIN(isin, pfIdx, posIdx, rawVal){
  const val=parseFloat(String(rawVal).replace(',','.'))||0;
  if(val<=0)return;
  const targetIsin=(isin||'').trim();
  state.portfolios.forEach(pf=>{
    pf.positions.forEach(pos=>{
      if((pos.isin||'').trim()===targetIsin){
        pos.kurs=val;
      }
    });
  });
  if(state.portfolios[pfIdx]?.positions[posIdx]){
    state.portfolios[pfIdx].positions[posIdx].kurs=val;
  }
  saveState();
  showToast(`✓ Kurs ${val.toFixed(4)} € für ${targetIsin} gesetzt`);
}

// Stückzahl analog zur Kurspflege über alle Portfolios synchronisieren
function updateSharesByISIN(isin, rawVal){
  const val=parseFloat(String(rawVal).replace(',','.'));
  if(isNaN(val)||val<0)return;
  const targetIsin=(isin||'').trim();
  if(!targetIsin)return;
  state.portfolios.forEach(pf=>{
    pf.positions.forEach(pos=>{
      if((pos.isin||'').trim()===targetIsin)pos.stueck=val;
    });
  });
  saveState();
  showToast(`✓ ${val} Stk für ${targetIsin} in allen Portfolios gesetzt`);
}

// NEU v3.5: automatische Plausibilitätsprüfung der eigenen Daten
function buildDataCheckBody(){
  const issues=[];
  // 1. Gleiche ISIN mit abweichender Stückzahl oder Kurs
  const byIsin={};
  state.portfolios.forEach(pf=>pf.positions.forEach(p=>{
    const k=(p.isin||'').trim(); if(!k)return;
    (byIsin[k]=byIsin[k]||[]).push({pf:pf.name,p});
  }));
  Object.entries(byIsin).forEach(([isin,list])=>{
    if(list.length<2)return;
    const st=new Set(list.map(x=>x.p.stueck.toFixed(6)));
    const ku=new Set(list.map(x=>x.p.kurs.toFixed(4)));
    if(st.size>1)issues.push(`<strong>${isin}</strong> hat unterschiedliche Stückzahlen in ${list.map(x=>x.pf).join(', ')}: ${[...st].join(' / ')}`);
    if(ku.size>1)issues.push(`<strong>${isin}</strong> hat unterschiedliche Kurse in ${list.map(x=>x.pf).join(', ')}: ${[...ku].join(' / ')}`);
  });
  // 2. Zielgewichte
  state.portfolios.forEach(pf=>{
    const all=pf.positions.reduce((s,p)=>s+p.target,0);
    if(pf.positions.length&&Math.abs(all-100)>1)
      issues.push(`<strong>${pf.name}</strong>: Zielgewichte aller Positionen summieren auf ${all.toFixed(1)} % statt 100 %`);
  });
  // 3. Unplausible Ausschüttungsrenditen
  uniquePositions().forEach(({pos})=>{
    const s=((pos.divs||{})[state.divCalYear]||[]).reduce((a,b)=>a+(b||0),0);
    if(s<=0||pos.kurs<=0)return;
    const y=s/pos.kurs*100;
    if(y>16)issues.push(`<strong>${pos.name.slice(0,40)}</strong>: implizite Ausschüttungsrendite ${y.toFixed(1)} % — bitte Beträge prüfen`);
  });
  // 4. Positionen ohne Stückzahl oder Kurs
  uniquePositions().forEach(({pos,pfName})=>{
    if(pos.stueck<=0)issues.push(`<strong>${pos.name.slice(0,40)}</strong> (${pfName}): Stückzahl ist 0`);
    else if(pos.kurs<=0)issues.push(`<strong>${pos.name.slice(0,40)}</strong> (${pfName}): kein Kurs hinterlegt`);
  });
  return`<p class="hint" style="margin-bottom:12px">Automatischer Selbsttest der hinterlegten Daten. Ersetzt keinen Abgleich mit dem Depotauszug.</p>
    ${issues.length===0
      ? `<div class="hint" style="color:var(--green);padding:8px">✓ Keine Auffälligkeiten gefunden</div>`
      : issues.map(i=>`<div style="font-size:12px;line-height:1.5;padding:8px 10px;margin-bottom:6px;background:rgba(255,230,0,.07);border:1px solid rgba(255,230,0,.3);border-radius:8px;color:var(--t2)">⚠ ${i}</div>`).join('')}`;
}

    </label>
